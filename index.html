<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f49">
<title>Team Huddle — September</title>
<style>
:root{--navy:#082f49;--blue:#0284c7;--ink:#172033;--muted:#64748b;--line:#dbe4ee;--page:#f4f7fb;--card:#fff;--green:#15803d;--greenbg:#dcfce7;--amber:#a16207;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:1180px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}.small{font-size:11px;color:var(--muted)}.section{font-size:18px;color:var(--navy);font-weight:1000;margin:18px 0 9px}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{background:linear-gradient(135deg,var(--navy),#0369a1);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{margin:2px 0 6px;font-size:clamp(26px,6vw,40px)}.hero p{margin:0;color:#dbeafe}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}
.hello{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#111827;border:2px solid #111827;border-radius:9px;padding:5px 9px;font-weight:1000;font-size:12px;transform:rotate(-4deg);box-shadow:3px 4px 0 #11182722}
.card,.context{background:#fff;border:1px solid var(--line);border-radius:15px}.body{padding:13px}.context{padding:12px;border-left:4px solid var(--blue)}.context h3{margin:0 0 5px;color:var(--navy);font-size:14px}.context p{margin:0;line-height:1.45;font-size:13px}.shout{border-left-color:#22c55e;background:#f0fdf4}
.shell{position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;padding:9px 12px;box-shadow:0 3px 18px #082f4930}.shellrow{max-width:1180px;margin:auto;display:flex;align-items:center;gap:8px}.shell button{border:0;border-radius:9px;padding:8px 10px;font-weight:900}.shell .home{background:#fff;color:var(--navy)}.shell .title{font-weight:1000;flex:1}.shellnav{display:flex;gap:6px;overflow:auto}.shellnav button{background:#ffffff14;color:#fff;white-space:nowrap}.shellnav button.active{background:#fff;color:var(--navy)}
.selector{min-height:100vh;padding:clamp(18px,4vw,44px) 0}.selectorHero{position:relative;background:linear-gradient(145deg,#082f49,#075985 65%,#0284c7);color:#fff;border-radius:26px;padding:clamp(24px,6vw,54px);overflow:hidden;box-shadow:0 20px 55px #082f4930}.selectorHero h1{font-size:clamp(38px,9vw,72px);line-height:.95;margin:8px 0 10px;letter-spacing:-.04em}.selectorHero p{max-width:720px;color:#dbeafe;line-height:1.5}.selectorHero .hello{position:absolute;right:22px;top:20px;font-size:15px}.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.profile{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:150px;box-shadow:0 10px 30px #0f172a0c;transition:.18s}.profile:hover{transform:translateY(-3px);border-color:#7dd3fc}.profile.team{background:linear-gradient(145deg,#fff,#e0f2fe)}.profile .who{font-size:25px;font-weight:1000;color:var(--navy)}.profile .desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:6px}.selectorTools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.tool summary{font-weight:1000;color:var(--navy);cursor:pointer}.tool .inside{font-size:12px;line-height:1.55;color:#475569;margin-top:9px}.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rules span{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:13px;padding:11px}.metric.good{border-top-color:var(--green)}.metric.warn{border-top-color:var(--amber)}.metric.bad{border-top-color:var(--red)}.metric .label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:950}.metric .value{font-size:23px;font-weight:1000;color:var(--navy);margin:3px 0}.metric .sub{font-size:10px;color:var(--muted)}
.secondary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.secondary .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.secondary .k{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900}.secondary .v{font-size:18px;color:var(--navy);font-weight:1000;margin-top:3px}
.repPane{display:none}.repPane.active{display:block}.repbanner{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;border-radius:17px;padding:16px;margin-bottom:10px}.repbanner h2{font-size:30px;margin:0}.repbanner p{color:#dbeafe;margin:5px 0 0}.rephead{display:flex;justify-content:space-between;gap:10px}
.sbs{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;overflow:hidden}.sbs summary{padding:11px;font-weight:900;color:var(--navy)}.sbs .inside{border-top:1px solid var(--line);padding:11px;font-size:13px;line-height:1.5}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:#eef2f6;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}
.modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}.modebar button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 13px;border-radius:999px;font-weight:950;font-size:12px}.modebar button.active{background:var(--navy);color:#fff}.modehint{font-size:11px;color:var(--muted);font-weight:800;margin-left:auto}.banner{border-radius:12px;padding:10px 12px;background:#eef6ff;border:1px solid #bfdbfe;font-size:12px}.moneygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.moneybox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.moneybox.risk{background:#fff7ed;border-color:#fdba74}.moneybox.lost{background:#fef2f2;border-color:#fca5a5}.moneybox.safe{background:#f0fdf4;border-color:#86efac}.moneybox .k,.read .k{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)}.moneybox .v{font-size:25px;font-weight:950;color:var(--navy);margin-top:4px}
.calcinputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.edit{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fafc}.edit label{display:block;font-size:10px;font-weight:950;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.edit input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-weight:900}.compare{font-size:11px;color:var(--muted);margin-top:5px}
.readgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.read{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.read .v{font-size:18px;font-weight:1000;color:var(--navy);margin-top:3px}
.qualgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.qual{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.qual.good{background:#f0fdf4;border-color:#86efac}.qual.warn{background:#fff7ed;border-color:#fdba74}.qual.bad{background:#fef2f2;border-color:#fca5a5}.qualtop{display:flex;justify-content:space-between;gap:8px}.qualname{font-weight:950;color:var(--navy)}.qualstatus{font-size:11px;font-weight:950}.qualdetail{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
.breakdown{display:grid;gap:7px}.breakrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6}.breakrow b{color:var(--navy)}.bigresult{border-radius:14px;padding:13px;border:1px solid var(--line);background:#f8fafc}.bigresult.good{background:#f0fdf4;border-color:#86efac}.bigresult.bad{background:#fef2f2;border-color:#fca5a5}.bigresult .headline{font-size:18px;font-weight:950;color:var(--navy)}.move{padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:12px;line-height:1.4;margin-top:7px}
.btn{border:0;background:var(--navy);color:#fff;padding:10px 13px;border-radius:10px;font-weight:900}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:80px}.adminGate{max-width:440px;margin:30px auto}.adminGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.archive{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.archive a{background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:900}
@media(max-width:820px){.profiles{grid-template-columns:repeat(2,1fr)}.selectorTools,.two{grid-template-columns:1fr}.secondary{grid-template-columns:repeat(2,1fr)}.calcinputs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.profiles,.calcinputs,.readgrid,.moneygrid,.qualgrid{grid-template-columns:1fr}.shellnav{display:none}.selectorHero .hello{position:static;margin-bottom:12px}}

/* Inline Manager Editing + Landing Coaching */
.managerRibbon{position:sticky;top:0;z-index:95;background:#fbbf24;color:#422006;padding:7px 12px;font-size:11px;font-weight:1000;letter-spacing:.04em;text-align:center;box-shadow:0 2px 10px #0002}
.adminEditable{position:relative;cursor:pointer;outline:1px dashed transparent;transition:.16s}
.adminEditable:hover,.adminEditable:active{outline-color:#0284c7;box-shadow:0 0 0 3px #0284c718}
.adminEditable:after{content:"✎";position:absolute;right:8px;top:7px;background:#082f49;color:#fff;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.88}
.contextMeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:10px;color:#64748b}
.statusPill{border-radius:999px;padding:3px 6px;background:#eef2f6;font-weight:850}
.landingCoach{margin-top:14px;border:1px solid #bae6fd;background:linear-gradient(135deg,#f0f9ff,#fff);border-radius:18px;padding:15px;min-height:116px;position:relative;overflow:hidden}
.landingCoach .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.landingCoach .tag{font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.12em;color:#0369a1}
.landingCoach h3{font-size:20px;color:#082f49;margin:8px 0 5px}
.landingCoach p{margin:0;color:#475569;font-size:13px;line-height:1.5;max-width:780px}
.cycleDots{display:flex;gap:5px;margin-top:11px}
.cycleDot{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:#cbd5e1}
.cycleDot.active{background:#0284c7;width:18px}
.todayStrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.todayTiny{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.todayTiny b{display:block;color:var(--navy);font-size:12px}
.todayTiny span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.editOverlay{display:none;position:fixed;inset:0;z-index:150;background:#0f172a88;padding:16px;align-items:center;justify-content:center}
.editOverlay.open{display:flex}
.editSheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 30px 80px #0005}
.editSheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.editSheetHead h2{margin:0;color:var(--navy);font-size:21px}
.editClose{border:0;background:#eef2f6;color:#334155;border-radius:999px;width:34px;height:34px;font-weight:1000}
.editActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.editActions .danger{background:#b91c1c}
.editTip{font-size:11px;color:#64748b;background:#f8fafc;border-radius:10px;padding:8px;margin-bottom:10px}
.saveToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:180;background:#082f49;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}
.saveToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.todayStrip{grid-template-columns:1fr}.adminEditable:after{right:5px;top:5px}}

</style>
</head>
<body>
<div id="shell"></div>
<main id="app"><div class="hero"><div class="eyebrow">Loading</div><h1>Team Huddle</h1><p>Connecting to September data…</p></div></main>
<script>
let DATA=null,adminPhrase=sessionStorage.getItem('huddleAdmin')||'';const app=document.getElementById('app'),shell=document.getElementById('shell');
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const money2=n=>'$'+Number(n||0).toFixed(2);const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`;const num=n=>Number(n||0).toLocaleString();
async function api(method='GET',body){const r=await fetch('/api/huddle',{method,headers:{'content-type':'application/json',...(adminPhrase?{'x-admin-phrase':adminPhrase}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{DATA=await api();render()}catch(e){app.innerHTML=`<div class="hero"><div class="eyebrow">Connection Problem</div><h1>September Huddle</h1><p>${e.message}</p></div>`}}
function goalClass(v,g){if(!g)return'';const x=Number(v)/Number(g);return x>=1?'good':x>=.75?'warn':'bad'}
function metric(label,value,goal,fmt='num'){const f=fmt==='money'?money:fmt==='pct'?pct:num;return `<div class="metric ${goalClass(value,goal)}"><div class="label">${label}</div><div class="value">${f(value)}</div><div class="sub">${goal?`Goal ${f(goal)}`:'Current'}</div></div>`}
function shellHtml(active){if(active==='home')return adminPhrase?`<div class="managerRibbon">MANAGER MODE · Tap editable coaching/text to change it · Hello?</div>`:'';return `${adminPhrase?`<div class="managerRibbon">MANAGER MODE · Tap editable coaching/text to change it · Hello?</div>`:''}<div class="shell"><div class="shellrow"><button class="home" data-home>← Profiles</button><div class="title">Team Huddle <span class="hello" style="margin-left:8px">Hello?</span></div><div class="shellnav"><button data-go="store" class="${active==='store'?'active':''}">Team</button><button data-go="sbs" class="${active==='sbs'?'active':''}">SBS</button><button data-go="archives" class="${active==='archives'?'active':''}">Archive</button><button data-go="admin" class="${active==='admin'?'active':''}">Edit</button></div></div></div>`}
function bindShell(){shell.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));shell.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
function howComp(){return `<details class="tool"><summary>How your comp works</summary><div class="inside"><b>PPV starts from a $15 base.</b> Every Upgrade adds $0.10 to that base and every Data adds $0.20. AIA pays 1.5× the final base. $60 Accessories and 60% Insurance each add a 25% accelerator.<div class="rules"><span>AIA 7.5%</span><span>HTP 5%</span><span>ACC/OPP $50</span><span>Insurance 50%</span><span>CSAT 88%</span></div><p><b>Miss a qualifier and qualified monthly comp goes to $0.</b> AIA instant spiffs still pay separately.</p></div></details>`}

let homeCycleTimer=null,homeCycleIndex=0;
function prettyDate(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function homeCoachItems(){
  const st=DATA.store||{},g=DATA.goals||{},items=[];
  const team=DATA.coaching.filter(c=>!c.rep_slug);
  team.filter(c=>c.kind==='shoutout').slice(0,1).forEach(c=>items.push({tag:'Shout Out',title:c.title,body:c.body}));
  team.filter(c=>c.kind!=='shoutout').slice(0,2).forEach(c=>items.push({tag:'Today’s Huddle',title:c.title,body:c.body}));
  if(Number(st.aia_green_count||0)>0){
    const rate=Number(st.aia_close||0),need=Math.max(0,Math.ceil(Number(st.aia_green_count||0)*.075-Number(st.aia_submits||0)));
    items.push({tag:'AIA Focus',title:rate>=.075?'Protect the AIA close rate':"Turn Green Counts into AIA",body:rate>=.075?`AIA Close is ${(rate*100).toFixed(1)}%. Keep converting the opportunities you are creating.`:`AIA Close is ${(rate*100).toFixed(1)}%. At the current Green Count, ${need||1} more submit${(need||1)===1?'':'s'} gets the team toward the 7.5% line.`});
  }
  if(Number(st.acc_per_opp||0)>0){
    const a=Number(st.acc_per_opp||0);
    items.push({tag:'Complete the Sale',title:a>=60?'Accessories are paying':'Every eligible OPP matters',body:a>=60?`Accessories are at $${a.toFixed(2)}/OPP. Protect the $60 accelerator with a complete recommendation.`:`Accessories are at $${a.toFixed(2)}/eligible OPP. $50 keeps qualification alive; $60 is where the accelerator starts.`});
  }
  if(Number(st.insurance_rate||0)>0){
    const i=Number(st.insurance_rate||0);
    items.push({tag:'Protection',title:i>=.60?'Keep the protection behavior':'Protection needs attention',body:i>=.60?`Protection is at ${(i*100).toFixed(1)}%. Keep presenting it consistently rather than assuming the early rate will hold.`:`Protection is at ${(i*100).toFixed(1)}%. The process goal is a full protection recommendation on every eligible interaction.`});
  }
  if(!items.length)items.push({tag:'Fresh Start',title:'Every interaction matters',body:'Build the month one complete interaction at a time.'});
  return items.slice(0,6);
}
function landingCoachHtml(){
  const items=homeCoachItems(),x=items[0];
  return `<div class="landingCoach" data-home-cycle><div class="topline"><div class="tag" data-cycle-tag>${x.tag}</div><span class="hello">Hello?</span></div><h3 data-cycle-title>${x.title}</h3><p data-cycle-body>${x.body}</p><div class="cycleDots">${items.map((_,i)=>`<button class="cycleDot ${i===0?'active':''}" data-cycle-dot="${i}" aria-label="Coaching item ${i+1}"></button>`).join('')}</div></div>`
}
function bindHomeCycle(){
  if(homeCycleTimer)clearInterval(homeCycleTimer);
  const box=document.querySelector('[data-home-cycle]');if(!box)return;
  const items=homeCoachItems();homeCycleIndex=0;
  const paint=i=>{homeCycleIndex=i;box.querySelector('[data-cycle-tag]').textContent=items[i].tag;box.querySelector('[data-cycle-title]').textContent=items[i].title;box.querySelector('[data-cycle-body]').textContent=items[i].body;box.querySelectorAll('[data-cycle-dot]').forEach((d,n)=>d.classList.toggle('active',n===i))};
  box.querySelectorAll('[data-cycle-dot]').forEach(d=>d.onclick=()=>paint(Number(d.dataset.cycleDot)));
  if(items.length>1)homeCycleTimer=setInterval(()=>paint((homeCycleIndex+1)%items.length),6500);
}
function coachingMeta(c){return `<div class="contextMeta"><span class="statusPill">${c.status||'new'}</span>${c.updated_at?`<span>Updated ${prettyDate(c.updated_at)}</span>`:''}${adminPhrase?`<span>Tap to edit</span>`:''}</div>`}
function editModalHtml(){return `<div class="editOverlay" id="editOverlay"><div class="editSheet"><div class="editSheetHead"><h2 id="editTitle">Edit</h2><button class="editClose" data-close-edit>×</button></div><div id="editFields"></div><div class="editActions" id="editActions"></div></div></div><div class="saveToast" id="saveToast">Saved</div>`}
function toast(msg='Saved'){const t=document.getElementById('saveToast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function closeEdit(){document.getElementById('editOverlay')?.classList.remove('open')}
function openCoachingEditor(id){
  if(!adminPhrase)return;const c=DATA.coaching.find(x=>String(x.id)===String(id));if(!c)return;
  const o=document.getElementById('editOverlay'),fields=document.getElementById('editFields'),actions=document.getElementById('editActions');
  document.getElementById('editTitle').textContent='Edit Coaching';
  fields.innerHTML=`<div class="editTip">Saving replaces this coaching card in Neon. Nothing else on the page is changed.</div><div class="field"><label>Title</label><input id="editCoachTitle"></div><div class="field"><label>Body</label><textarea id="editCoachBody"></textarea></div><div class="adminGrid"><div class="field"><label>Type</label><select id="editCoachKind"><option value="coach">Coach</option><option value="shoutout">Shoutout</option><option value="finish">Finish</option></select></div><div class="field"><label>Status</label><select id="editCoachStatus"><option value="new">New</option><option value="working">Working On It</option><option value="improved">Improved</option></select></div></div>`;
  document.getElementById('editCoachTitle').value=c.title||'';document.getElementById('editCoachBody').value=c.body||'';document.getElementById('editCoachKind').value=c.kind||'coach';document.getElementById('editCoachStatus').value=c.status||'new';
  actions.innerHTML=`<button class="btn" data-save-coach>Save</button><button class="btn danger" data-delete-coach>Delete</button><button class="btn alt" data-close-edit>Cancel</button>`;
  actions.querySelector('[data-save-coach]').onclick=async()=>{const title=document.getElementById('editCoachTitle').value.trim(),body=document.getElementById('editCoachBody').value.trim(),kind=document.getElementById('editCoachKind').value,status=document.getElementById('editCoachStatus').value;if(!title||!body)return;await api('POST',{action:'delete_coaching',id:c.id});await api('POST',{action:'add_coaching',title,body,kind,status,rep_slug:c.rep_slug||null,sort_order:c.sort_order||100});closeEdit();toast();await load()};
  actions.querySelector('[data-delete-coach]').onclick=async()=>{if(!confirm('Delete this coaching card?'))return;await api('POST',{action:'delete_coaching',id:c.id});closeEdit();toast('Deleted');await load()};
  o.classList.add('open');o.querySelectorAll('[data-close-edit]').forEach(b=>b.onclick=closeEdit);
}
function openTeamMessageEditor(){
  if(!adminPhrase)return;const o=document.getElementById('editOverlay'),fields=document.getElementById('editFields'),actions=document.getElementById('editActions');
  document.getElementById('editTitle').textContent='Edit Team Message';
