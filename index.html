<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f49">
<title>Team Huddle — September</title>
<style>
:root{--navy:#082f49;--blue:#0284c7;--ink:#172033;--muted:#64748b;--line:#dbe4ee;--page:#f4f7fb;--card:#fff;--green:#15803d;--greenbg:#dcfce7;--amber:#a16207;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}main{max-width:1180px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}.small{font-size:11px;color:var(--muted)}.section{font-size:18px;color:var(--navy);font-weight:1000;margin:18px 0 9px}.grid{display:grid;gap:10px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{background:linear-gradient(135deg,var(--navy),#0369a1);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{margin:2px 0 6px;font-size:clamp(26px,6vw,40px)}.hero p{margin:0;color:#dbeafe}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}
.hello{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#111827;border:2px solid #111827;border-radius:9px;padding:5px 9px;font-weight:1000;font-size:12px;transform:rotate(-4deg);box-shadow:3px 4px 0 #11182722}
.card,.context{background:#fff;border:1px solid var(--line);border-radius:15px}.body{padding:13px}.context{padding:12px;border-left:4px solid var(--blue)}.context h3{margin:0 0 5px;color:var(--navy);font-size:14px}.context p{margin:0;line-height:1.45;font-size:13px}.shout{border-left-color:#22c55e;background:#f0fdf4}
.shell{position:sticky;top:0;z-index:80;background:var(--navy);color:#fff;padding:9px 12px;box-shadow:0 3px 18px #082f4930}.shellrow{max-width:1180px;margin:auto;display:flex;align-items:center;gap:8px}.shell button{border:0;border-radius:9px;padding:8px 10px;font-weight:900}.shell .home{background:#fff;color:var(--navy)}.shell .title{font-weight:1000;flex:1}.shellnav{display:flex;gap:6px;overflow:auto}.shellnav button{background:#ffffff14;color:#fff;white-space:nowrap}.shellnav button.active{background:#fff;color:var(--navy)}
.selector{min-height:100vh;padding:clamp(18px,4vw,44px) 0}.selectorHero{position:relative;background:linear-gradient(145deg,#082f49,#075985 65%,#0284c7);color:#fff;border-radius:26px;padding:clamp(24px,6vw,54px);overflow:hidden;box-shadow:0 20px 55px #082f4930}.selectorHero h1{font-size:clamp(38px,9vw,72px);line-height:.95;margin:8px 0 10px;letter-spacing:-.04em}.selectorHero p{max-width:720px;color:#dbeafe;line-height:1.5}.selectorHero .hello{position:absolute;right:22px;top:20px;font-size:15px}.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.profile{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:150px;box-shadow:0 10px 30px #0f172a0c;transition:.18s}.profile:hover{transform:translateY(-3px);border-color:#7dd3fc}.profile.team{background:linear-gradient(145deg,#fff,#e0f2fe)}.profile .who{font-size:25px;font-weight:1000;color:var(--navy)}.profile .desc{font-size:12px;color:var(--muted);line-height:1.4;margin-top:6px}.selectorTools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.tool summary{font-weight:1000;color:var(--navy);cursor:pointer}.tool .inside{font-size:12px;line-height:1.55;color:#475569;margin-top:9px}.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rules span{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:13px;padding:11px}.metric.good{border-top-color:var(--green)}.metric.warn{border-top-color:var(--amber)}.metric.bad{border-top-color:var(--red)}.metric .label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:950}.metric .value{font-size:23px;font-weight:1000;color:var(--navy);margin:3px 0}.metric .sub{font-size:10px;color:var(--muted)}
.secondary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.secondary .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.secondary .k{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:900}.secondary .v{font-size:18px;color:var(--navy);font-weight:1000;margin-top:3px}
.repPane{display:none}.repPane.active{display:block}.repbanner{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;border-radius:17px;padding:16px;margin-bottom:10px}.repbanner h2{font-size:30px;margin:0}.repbanner p{color:#dbeafe;margin:5px 0 0}.rephead{display:flex;justify-content:space-between;gap:10px}
.sbs{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;overflow:hidden}.sbs summary{padding:11px;font-weight:900;color:var(--navy)}.sbs .inside{border-top:1px solid var(--line);padding:11px;font-size:13px;line-height:1.5}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:#eef2f6;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}
.modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}.modebar button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 13px;border-radius:999px;font-weight:950;font-size:12px}.modebar button.active{background:var(--navy);color:#fff}.modehint{font-size:11px;color:var(--muted);font-weight:800;margin-left:auto}.banner{border-radius:12px;padding:10px 12px;background:#eef6ff;border:1px solid #bfdbfe;font-size:12px}.moneygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.moneybox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.moneybox.risk{background:#fff7ed;border-color:#fdba74}.moneybox.lost{background:#fef2f2;border-color:#fca5a5}.moneybox.safe{background:#f0fdf4;border-color:#86efac}.moneybox .k,.read .k{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted)}.moneybox .v{font-size:25px;font-weight:950;color:var(--navy);margin-top:4px}
.calcinputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.edit{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fafc}.edit label{display:block;font-size:10px;font-weight:950;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.edit input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-weight:900}.compare{font-size:11px;color:var(--muted);margin-top:5px}
.readgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.read{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.read .v{font-size:18px;font-weight:1000;color:var(--navy);margin-top:3px}
.qualgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.qual{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.qual.good{background:#f0fdf4;border-color:#86efac}.qual.warn{background:#fff7ed;border-color:#fdba74}.qual.bad{background:#fef2f2;border-color:#fca5a5}.qualtop{display:flex;justify-content:space-between;gap:8px}.qualname{font-weight:950;color:var(--navy)}.qualstatus{font-size:11px;font-weight:950}.qualdetail{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
.breakdown{display:grid;gap:7px}.breakrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f6}.breakrow b{color:var(--navy)}.bigresult{border-radius:14px;padding:13px;border:1px solid var(--line);background:#f8fafc}.bigresult.good{background:#f0fdf4;border-color:#86efac}.bigresult.bad{background:#fef2f2;border-color:#fca5a5}.bigresult .headline{font-size:18px;font-weight:950;color:var(--navy)}.move{padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:12px;line-height:1.4;margin-top:7px}
.btn{border:0;background:var(--navy);color:#fff;padding:10px 13px;border-radius:10px;font-weight:900}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:80px}.adminGate{max-width:440px;margin:30px auto}.adminGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.archive{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.archive a{background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:9px 12px;font-weight:900}
@media(max-width:820px){.profiles{grid-template-columns:repeat(2,1fr)}.selectorTools,.two{grid-template-columns:1fr}.secondary{grid-template-columns:repeat(2,1fr)}.calcinputs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.profiles,.calcinputs,.readgrid,.moneygrid,.qualgrid{grid-template-columns:1fr}.shellnav{display:none}.selectorHero .hello{position:static;margin-bottom:12px}}

/* Inline Manager Editing + Landing Coaching */
.managerRibbon{position:sticky;top:0;z-index:95;background:#fbbf24;color:#422006;padding:7px 12px;font-size:11px;font-weight:1000;letter-spacing:.04em;text-align:center;box-shadow:0 2px 10px #0002}
.adminEditable{position:relative;cursor:pointer;outline:1px dashed transparent;transition:.16s}
.adminEditable:hover,.adminEditable:active{outline-color:#0284c7;box-shadow:0 0 0 3px #0284c718}
.adminEditable:after{content:"✎";position:absolute;right:8px;top:7px;background:#082f49;color:#fff;border-radius:999px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.88}
.contextMeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:10px;color:#64748b}
.statusPill{border-radius:999px;padding:3px 6px;background:#eef2f6;font-weight:850}
.landingCoach{margin-top:14px;border:1px solid #bae6fd;background:linear-gradient(135deg,#f0f9ff,#fff);border-radius:18px;padding:15px;min-height:116px;position:relative;overflow:hidden}
.landingCoach .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.landingCoach .tag{font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.12em;color:#0369a1}
.landingCoach h3{font-size:20px;color:#082f49;margin:8px 0 5px}
.landingCoach p{margin:0;color:#475569;font-size:13px;line-height:1.5;max-width:780px}
.cycleDots{display:flex;gap:5px;margin-top:11px}
.cycleDot{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:#cbd5e1}
.cycleDot.active{background:#0284c7;width:18px}
.todayStrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.todayTiny{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.todayTiny b{display:block;color:var(--navy);font-size:12px}
.todayTiny span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.editOverlay{display:none;position:fixed;inset:0;z-index:150;background:#0f172a88;padding:16px;align-items:center;justify-content:center}
.editOverlay.open{display:flex}
.editSheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:16px;box-shadow:0 30px 80px #0005}
.editSheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.editSheetHead h2{margin:0;color:var(--navy);font-size:21px}
.editClose{border:0;background:#eef2f6;color:#334155;border-radius:999px;width:34px;height:34px;font-weight:1000}
.editActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.editActions .danger{background:#b91c1c}
.editTip{font-size:11px;color:#64748b;background:#f8fafc;border-radius:10px;padding:8px;margin-bottom:10px}
.saveToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);z-index:180;background:#082f49;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}
.saveToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.todayStrip{grid-template-columns:1fr}.adminEditable:after{right:5px;top:5px}}


/* ===== Literal Whiteboard Team Page ===== */
:root{--marker:#172033;--board-red:#b91c1c;--board-green:#15803d;--board-super:#1d4ed8;--sticky:#fff3a6}
.hello{background:var(--sticky);border:0;border-radius:2px;padding:7px 11px;box-shadow:2px 4px 8px #0f172a25;transform:rotate(-3deg);font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:13px}
.whiteboard{
  position:relative;min-height:720px;margin-top:10px;padding:22px 20px 42px;
  border:10px solid #d1d5db;border-radius:13px;
  background:
    radial-gradient(circle at 12% 18%,#00000008 0 1px,transparent 2px),
    radial-gradient(circle at 76% 67%,#00000007 0 1px,transparent 2px),
    linear-gradient(180deg,#fff,#fbfcfd);
  box-shadow:inset 0 0 24px #64748b18,0 10px 28px #0f172a16;
  overflow:hidden
}
.whiteboard:after{content:"";position:absolute;left:8%;right:8%;bottom:7px;height:8px;border-radius:999px;background:#cbd5e1;box-shadow:0 2px 2px #0002}
.boardTop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid #1f2937;padding-bottom:8px;margin-bottom:8px;font-family:"Comic Sans MS","Bradley Hand",cursive}
.boardTop h1{margin:0;font-size:clamp(31px,7vw,52px);letter-spacing:.02em}
.boardTop .boardDate{font-weight:900;font-size:14px;transform:rotate(1deg)}
.boardGrid{position:relative;z-index:2;width:min(760px,100%);padding-bottom:20px}
.boardRow{display:grid;grid-template-columns:minmax(118px,1.15fr) minmax(115px,.85fr) minmax(210px,2fr);gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #64748b33;font-family:"Comic Sans MS","Bradley Hand",cursive}
.boardMetric{font-size:16px;font-weight:900;text-transform:uppercase}
.boardValue{font-size:20px;font-weight:1000;white-space:nowrap}
.boardNote{font-size:14px;line-height:1.25;font-weight:700}
.boardRow.bad .boardValue,.boardRow.bad .boardNote{color:var(--board-red)}
.boardRow.good .boardValue,.boardRow.good .boardNote{color:#16a34a}
.boardRow.super .boardValue,.boardRow.super .boardNote{color:#1d4ed8;font-weight:1000}
.boardRow.neutral .boardValue,.boardRow.neutral .boardNote{color:#334155}
.boardLegend{font-family:"Comic Sans MS","Bradley Hand",cursive;font-size:11px;margin:9px 0 15px;color:#475569}
.boardLegend b:nth-child(1){color:var(--board-red)}.boardLegend b:nth-child(2){color:#16a34a}.boardLegend b:nth-child(3){color:#1d4ed8}
.stickyZone{position:absolute;z-index:5;right:18px;top:84px;width:min(31%,330px);display:grid;gap:14px}
.sticky{
  position:relative;background:var(--sticky);padding:17px 15px 18px;min-height:116px;
  border:0;border-radius:2px;box-shadow:3px 7px 13px #0f172a2a;
  font-family:"Comic Sans MS","Bradley Hand",cursive;touch-action:none;user-select:none
}
.sticky:nth-child(2n){transform:rotate(1.5deg)}.sticky:nth-child(2n+1){transform:rotate(-1.2deg)}
.sticky h3{margin:0 0 7px;font-size:17px;color:#1f2937}.sticky p{margin:0;font-size:13px;line-height:1.35;color:#334155}
.sticky .contextMeta{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.sticky.launch{background:#dbeafe}.sticky.shoutSticky{background:#dcfce7}.sticky.focusSticky{background:#fee2e2}
.sticky.dragging{opacity:.9;transform:rotate(0) scale(1.02);box-shadow:7px 13px 22px #0f172a35;z-index:20}
.stickyHandle{position:absolute;right:8px;top:7px;font-family:Inter,sans-serif;font-size:10px;color:#64748b;font-weight:900}
.boardOther{position:relative;z-index:2;width:min(760px,100%);display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-family:"Comic Sans MS","Bradley Hand",cursive}
.boardOther span{border:2px solid #334155;border-radius:5px;padding:5px 8px;font-size:12px;font-weight:900}
@media(max-width:900px){
 .whiteboard{overflow:visible;padding:16px 12px 26px}
 .stickyZone{position:relative;right:auto;top:auto;width:100%;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px}
 .boardGrid{width:100%}.boardRow{grid-template-columns:1fr 1fr;gap:5px 8px}.boardNote{grid-column:1/-1;padding-left:12px}
}
@media(max-width:560px){.stickyZone{grid-template-columns:1fr}.boardMetric{font-size:13px}.boardValue{font-size:18px}}


/* ===== Whiteboard V2: mobile-first, classic toggle, free-floating notes ===== */
:root{
  --marker-font:"Segoe Print","Bradley Hand","Comic Sans MS","Arial Black",cursive;
}
body.whiteboardMode .hero,
body.whiteboardMode .repbanner,
body.whiteboardMode .metrics,
body.whiteboardMode .secondary,
body.whiteboardMode .section,
body.whiteboardMode .context:not(.sticky),
body.whiteboardMode .card:not(.keepClassic),
body.whiteboardMode .sbs,
body.whiteboardMode .archive{
  font-family:var(--marker-font);
}
.viewToggle{
  position:fixed;right:12px;bottom:12px;z-index:140;
  border:0;border-radius:999px;padding:10px 13px;font-weight:1000;
  background:#fff;color:#082f49;box-shadow:0 5px 18px #0f172a33;
}
.notesRestore{
  position:fixed;right:12px;bottom:58px;z-index:140;
  border:0;border-radius:999px;padding:9px 12px;font-weight:1000;
  background:#fff3a6;color:#111827;box-shadow:0 5px 18px #0f172a33;
  font-family:var(--marker-font)
}
.floatNotesLayer{
  position:fixed;inset:0;pointer-events:none;z-index:120;
}
.floatSticky{
  position:absolute;pointer-events:auto;
  min-width:160px;max-width:min(86vw,420px);min-height:110px;
  background:#fff3a6;border-radius:3px;padding:18px 16px 16px;
  box-shadow:4px 8px 18px #0f172a30;
  font-family:var(--marker-font);touch-action:none;user-select:none;
  transform:rotate(-1deg)
}
.floatSticky.blue{background:#dbeafe}.floatSticky.green{background:#dcfce7}.floatSticky.red{background:#fee2e2}
.floatSticky h3{margin:0 22px 7px 0;font-size:18px;line-height:1.05}
.floatSticky p{margin:0;font-size:13px;line-height:1.35}
.floatSticky .closeSticky{
  position:absolute;right:5px;top:5px;width:28px;height:28px;border:0;border-radius:50%;
  background:#ffffffcc;color:#111827;font-weight:1000;font-size:16px;
  display:flex;align-items:center;justify-content:center
}
.floatSticky.dragging{opacity:.94;box-shadow:8px 16px 28px #0f172a42;transform:rotate(0)}
.floatSticky .resizeHint{position:absolute;left:8px;bottom:4px;font:700 9px/1 Inter,Arial,sans-serif;color:#64748b}
body.classicView .whiteboard{display:none}
body.classicView .classicTeam{display:block!important}
body:not(.classicView) .classicTeam{display:none!important}
.repWhiteboard{
  border:9px solid #d1d5db;border-radius:13px;background:linear-gradient(180deg,#fff,#fbfcfd);
  box-shadow:inset 0 0 24px #64748b18,0 10px 28px #0f172a16;
  padding:16px;margin-bottom:12px;font-family:var(--marker-font)
}
.repWhiteboard h2{margin:0 0 4px;font-size:34px}
.repBoardGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.repBoardItem{border-bottom:1px solid #64748b33;padding:8px 4px}
.repBoardItem .k{font-size:11px;font-weight:1000;text-transform:uppercase}
.repBoardItem .v{font-size:21px;font-weight:1000}
.repBoardItem.bad{color:#b91c1c}.repBoardItem.good{color:#16a34a}.repBoardItem.super{color:#1d4ed8}
@media(max-width:560px){
  .viewToggle{right:8px;bottom:8px;padding:9px 11px;font-size:11px}
  .notesRestore{right:8px;bottom:50px;padding:8px 10px;font-size:11px}
  .repBoardGrid{grid-template-columns:1fr 1fr}
  .repWhiteboard{padding:11px;border-width:6px}
  .repWhiteboard h2{font-size:28px}
  .floatSticky{min-width:145px;max-width:88vw}
}


/* ===== Whiteboard V3: organized note tray + blockier marker font ===== */
:root{
  --marker-font:"Marker Felt","Chalkboard SE","Arial Black","Segoe Print","Comic Sans MS",cursive;
  --marker-block:"Arial Black","Marker Felt","Chalkboard SE",sans-serif;
}
.boardTop h1,.boardMetric,.boardValue,.repWhiteboard h2,.repBoardItem .k,.repBoardItem .v{
  font-family:var(--marker-block);
  letter-spacing:.01em
}
.boardNote,.sticky,.noteDockCard,.floatSticky{
  font-family:var(--marker-font)
}
.noteDockWrap{
  margin-top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  position:relative;
  z-index:6;
}
.noteDockNav{
  width:40px;height:40px;border:0;border-radius:50%;
  background:#fff;color:#082f49;font-size:24px;font-weight:1000;
  box-shadow:0 4px 14px #0f172a22;
}
.noteDock{

<body>
<div id="shell"></div>
<main id="app"><div class="hero"><div class="eyebrow">Loading</div><h1>Team Huddle</h1><p>Connecting to September data…</p></div></main>
<script>

// V3.1 one-time note reset: clears stale hidden/detached note state from earlier builds.
(function(){
  const resetKey='huddleNotesReset_v31';
  if(!localStorage.getItem(resetKey)){
    localStorage.removeItem('huddleHiddenNotes');
    localStorage.removeItem('huddleDetachedNotes');
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith('huddleFloatNote:')||k.startsWith('huddleSticky:')) localStorage.removeItem(k);
    });
    localStorage.setItem(resetKey,'1');
  }
})();

let DATA=null,adminPhrase=sessionStorage.getItem('huddleAdmin')||'';const app=document.getElementById('app'),shell=document.getElementById('shell');
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const money2=n=>'$'+Number(n||0).toFixed(2);const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`;const num=n=>Number(n||0).toLocaleString();
async function api(method='GET',body){const r=await fetch('/api/huddle',{method,headers:{'content-type':'application/json',...(adminPhrase?{'x-admin-phrase':adminPhrase}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{DATA=await api();render()}catch(e){app.innerHTML=`<div class="hero"><div class="eyebrow">Connection Problem</div><h1>September Huddle</h1><p>${e.message}</p></div>`}}
function goalClass(v,g){if(!g)return'';const x=Number(v)/Number(g);return x>=1?'good':x>=.75?'warn':'bad'}
function metric(label,value,goal,fmt='num'){const f=fmt==='money'?money:fmt==='pct'?pct:num;return `<div class="metric ${goalClass(value,goal)}"><div class="label">${label}</div><div class="value">${f(value)}</div><div class="sub">${goal?`Goal ${f(goal)}`:'Current'}</div></div>`}
function boardFmt(v,fmt='num'){return fmt==='money'?money2(v):fmt==='pct'?pct(v):num(v)}
function monthPaceRatio(v,goal){
  if(!goal)return null;
  const now=new Date(), active=String(DATA?.config?.active_month||'');
  let elapsed=now.getDate(),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  if(active && !active.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`)){elapsed=1;days=30}
  const expected=Number(goal||0)*(elapsed/days);
  return expected?Number(v||0)/expected:null;
}
function boardRatio(v,goal,{pace=true}={}){
  if(goal===null||goal===undefined||Number(goal)===0)return null;
  return pace?monthPaceRatio(v,goal):Number(v||0)/Number(goal);
}
function boardStatus(v,goal,{pace=true,higher=true}={}){
  if(goal===null||goal===undefined||Number(goal)===0)return'neutral';
  const x=boardRatio(v,goal,{pace});
  if(!higher){
    if(x<=.75)return'super';
    if(x<=1)return'good';
    return'bad';
  }
  if(x>=1.25)return'super';
  if(x>=1)return'good';
  return'bad';
}
function boardCloseBand(v,goal,{pace=true,higher=true}={}){
  if(goal===null||goal===undefined||Number(goal)===0)return false;
  const x=boardRatio(v,goal,{pace});
  if(x===null)return false;
  if(!higher)return x>.90&&x<=1.10;
  return x>=.90&&x<1.10;
}
function boardNote(label,v,g,status,fmt='num'){
  const value=Number(v||0),goal=Number(g||0),ratio=g?monthPaceRatio(v,g):null;
  const directRatio=goal?value/goal:null;
  const paceNearBehind=ratio!==null&&ratio>=.90&&ratio<1;
  const paceNearAhead=ratio!==null&&ratio>=1&&ratio<1.10;

  if(label==='PPV'){
    if(status==='super')return'Crushing pace. Keep building the cushion before launch.';
    if(paceNearAhead)return'Barely holding pace. Create breathing room before launch.';
    if(status==='good')return'On pace. Keep pressing before launch.';
    if(paceNearBehind)return'Just off pace. One good push gets us back over the line.';
    return'Behind pace. Every interaction needs a complete PPV conversation.';
  }
  if(label==='PPV Close'){
    if(value>=goal*1.25)return'Well above the 3.5% goal. Protect it.';
    if(value>=goal)return directRatio<1.10?'Barely holding the 3.5% goal. Keep converting traffic.':'At goal. Keep converting traffic.';
    if(directRatio>=.90)return'Just under 3.5%. Very close — tighten the opportunity conversation.';
    return'Below 3.5%. Tighten the opportunity conversation.';
  }
  if(label==='AIA Posted'){
    if(status==='super')return'Crushing AIA pace. Keep every lead attached in Salesforce.';
    if(paceNearAhead)return'Barely holding pace. Keep attaching leads in Salesforce before launch.';
    if(status==='good')return'On pace. Keep attaching leads in Salesforce before launch.';
    if(paceNearBehind)return'Just off pace. One more posted AIA changes the picture.';
    return'Posted volume needs a push. Attach leads in Salesforce before launch.';
  }
  if(label==='AIA Close'){
    if(value>=goal*1.25)return'Crushing the qualifier. Keep converting Green Checks into submits.';
    if(value>=goal)return directRatio<1.10?'Barely holding the qualifier. Keep converting Green Checks.':'Qualified. Keep converting Green Checks into submits.';
    if(directRatio>=.90)return'Just under 7.5%. One conversion can flip this.';
    return'Below 7.5%. More Green Checks need to become submits.';
  }
  if(label==='Upgrades'){
    if(status==='super')return'Crushing pace. Use the volume to sharpen launch execution.';
    if(paceNearAhead)return'Barely holding pace. Build some breathing room before launch.';
    if(status==='good')return'On pace. Use upgrade traffic to practice the full launch process.';
    if(paceNearBehind)return'Just off pace. Work every eligible upgrade before launch.';
    return'Behind pace. Work every eligible upgrade before launch.';
  }
  if(label==='Data'){
    if(value===0)return'Zero is the hole. Ask the connected-device question every time.';
    if(status==='super')return'Crushing pace. Keep asking every time.';
    if(paceNearAhead)return'Barely holding pace. Keep the connected-device question automatic.';
    if(status==='good')return'On pace. Keep asking every time.';
    if(paceNearBehind)return'Just off pace. One good push gets this back on track.';
    return'Needs a push — do not carry this gap into launch.';
  }
  if(label==='HTP Close'){
    if(value>=goal*1.25)return'Crushing the qualifier. Keep HTP in the full recommendation.';
    if(value>=goal)return directRatio<1.10?'Barely holding the qualifier. Keep HTP in every recommendation.':'Qualified. Keep HTP in the full recommendation.';
    if(directRatio>=.90)return'Just under 5%. Very close — keep HTP in the process.';
    return'Below 5%. HTP has to be part of the process.';
  }
  if(label==='ACC / Eligible OPP'){
    if(value>=goal*1.25)return'Crushing it. Protect the accessory accelerator.';
    if(value>=60)return directRatio<1.10?'Barely over the accelerator line. Keep building the bundle.':'Accelerator territory. Do not give this money back.';
    if(value>=50)return'Qualified, but push toward the $60 accelerator.';
    if(value>=45)return'Just under the $50 qualifier. One strong bundle can move this.';
    return'Below $50. Finish the sale with the full accessory solution.';
  }
  if(label==='Insurance'){
    if(value>=goal*1.25)return'Crushing protection. Keep presenting it every time.';
    if(value>=.60)return directRatio<1.10?'Barely over the accelerator line. Keep presenting every time.':'Accelerator territory. Keep presenting it every time.';
    if(value>=.50)return'Qualified, but the 60% accelerator is still there.';
    if(value>=.45)return'Just under the 50% qualifier. Immediate push needed.';
    return'Below the 50% qualifier. Immediate comp risk.';
  }
  if(label==='CSAT'){
    if(value>=goal*1.25)return'Crushing it. Keep the customer experience clean.';
    if(value>=goal)return directRatio<1.10?'Barely holding the goal. Protect every interaction.':'Clean. Keep it there.';
    if(directRatio>=.90)return'Just under goal. Protect every customer interaction.';
    return'Needs attention — protect the customer experience.';
  }
  if(label==='Trade-In'){
    if(status==='super')return'Crushing pace. Keep checking trade value every time.';
    if(paceNearAhead)return'Barely holding pace. Keep trade in the launch conversation.';
    if(status==='good')return'On pace. Keep trade in the launch conversation.';
    if(paceNearBehind)return'Just off pace. Check trade value on every eligible device.';
    return'Needs a push. Check trade value on every eligible device.';
  }
  if(status==='super')return'Crushing it.';
  if(paceNearAhead)return'Barely holding pace.';
  if(status==='good')return'On pace — keep pushing.';
  if(paceNearBehind)return'Just off pace — one push can flip it.';
  return'Behind pace — needs attention.';
}
function boardRow(label,v,g,fmt='num',opts={}){
  const status=boardStatus(v,g,opts),close=boardCloseBand(v,g,opts)?' closeBand':'',goalText=g!==null&&g!==undefined?` / ${boardFmt(g,fmt)}`:'';
  return `<div class="boardRow ${status}${close}"><div class="boardMetric">${label}</div><div class="boardValue">${boardFmt(v,fmt)}${goalText}</div><div class="boardNote">${boardNote(label,v,g,status,fmt)}</div></div>`;
}

function shellHtml(active){if(active==='home')return adminPhrase?`<div class="managerRibbon">MANAGER MODE · Tap editable coaching/text to change it · Hello?</div>`:'';return `${adminPhrase?`<div class="managerRibbon">MANAGER MODE · Tap editable coaching/text to change it · Hello?</div>`:''}<div class="shell"><div class="shellrow"><button class="home" data-home>← Profiles</button><div class="title">Team Huddle <span class="hello" style="margin-left:8px">Hello?</span></div><div class="shellnav"><button data-go="store" class="${active==='store'?'active':''}">Team</button><button data-go="sbs" class="${active==='sbs'?'active':''}">SBS</button><button data-go="archives" class="${active==='archives'?'active':''}">Archive</button><button data-go="admin" class="${active==='admin'?'active':''}">Edit</button></div></div></div>`}
function bindShell(){shell.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));shell.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
function howComp(){return `<details class="tool"><summary>How your comp works</summary><div class="inside"><b>PPV starts from a $15 base.</b> Every Upgrade adds $0.10 to that base and every Data adds $0.20. AIA pays 1.5× the final base. $60 Accessories and 60% Insurance each add a 25% accelerator.<div class="rules"><span>AIA 7.5%</span><span>HTP 5%</span><span>ACC/OPP $50</span><span>Insurance 50%</span><span>CSAT 88%</span></div><p><b>Miss a qualifier and qualified monthly comp goes to $0.</b> AIA instant spiffs still pay separately.</p></div></details>`}

let homeCycleTimer=null,homeCycleIndex=0;
function prettyDate(v){if(!v)return'';const d=new Date(v);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function homeCoachItems(){
  const st=DATA.store||{},g=DATA.goals||{},items=[];
  const team=DATA.coaching.filter(c=>!c.rep_slug);
  team.filter(c=>c.kind==='shoutout').slice(0,1).forEach(c=>items.push({tag:'Shout Out',title:c.title,body:c.body}));
  team.filter(c=>c.kind!=='shoutout').slice(0,2).forEach(c=>items.push({tag:'Today’s Huddle',title:c.title,body:c.body}));
  if(Number(st.aia_green_count||0)>0){
    const rate=Number(st.aia_close||0),need=Math.max(0,Math.ceil(Number(st.aia_green_count||0)*.075-Number(st.aia_submits||0)));
    items.push({tag:'AIA Focus',title:rate>=.075?'Protect the AIA close rate':"Turn Green Counts into AIA",body:rate>=.075?`AIA Close is ${(rate*100).toFixed(1)}%. Keep converting the opportunities you are creating.`:`AIA Close is ${(rate*100).toFixed(1)}%. At the current Green Count, ${need||1} more submit${(need||1)===1?'':'s'} gets the team toward the 7.5% line.`});
  }
  if(Number(st.acc_per_opp||0)>0){
    const a=Number(st.acc_per_opp||0);
    items.push({tag:'Complete the Sale',title:a>=60?'Accessories are paying':'Every eligible OPP matters',body:a>=60?`Accessories are at $${a.toFixed(2)}/OPP. Protect the $60 accelerator with a complete recommendation.`:`Accessories are at $${a.toFixed(2)}/eligible OPP. $50 keeps qualification alive; $60 is where the accelerator starts.`});
  }
  if(Number(st.insurance_rate||0)>0){
    const i=Number(st.insurance_rate||0);
    items.push({tag:'Protection',title:i>=.60?'Keep the protection behavior':'Protection needs attention',body:i>=.60?`Protection is at ${(i*100).toFixed(1)}%. Keep presenting it consistently rather than assuming the early rate will hold.`:`Protection is at ${(i*100).toFixed(1)}%. The process goal is a full protection recommendation on every eligible interaction.`});
  }
  if(!items.length)items.push({tag:'Fresh Start',title:'Every interaction matters',body:'Build the month one complete interaction at a time.'});
  return items.slice(0,6);
}
function landingCoachHtml(){
  const items=homeCoachItems(),x=items[0];
  return `<div class="landingCoach" data-home-cycle><div class="topline"><div class="tag" data-cycle-tag>${x.tag}</div><span class="hello">Hello?</span></div><h3 data-cycle-title>${x.title}</h3><p data-cycle-body>${x.body}</p><div class="cycleDots">${items.map((_,i)=>`<button class="cycleDot ${i===0?'active':''}" data-cycle-dot="${i}" aria-label="Coaching item ${i+1}"></button>`).join('')}</div></div>`

function bindHomeCycle(){
  if(homeCycleTimer)clearInterval(homeCycleTimer);
  const box=document.querySelector('[data-home-cycle]');if(!box)return;
  const items=homeCoachItems();homeCycleIndex=0;
  const paint=i=>{homeCycleIndex=i;box.querySelector('[data-cycle-tag]').textContent=items[i].tag;box.querySelector('[data-cycle-title]').textContent=items[i].title;box.querySelector('[data-cycle-body]').textContent=items[i].body;box.querySelectorAll('[data-cycle-dot]').forEach((d,n)=>d.classList.toggle('active',n===i))};

function toast(msg='Saved'){const t=document.getElementById('saveToast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}

function openCoachingEditor(id){
  if(!adminPhrase)return;const c=DATA.coaching.find(x=>String(x.id)===String(id));if(!c)return;
  const o=document.getElementById('editOverlay'),fields=document.getElementById('editFields'),actions=document.getElementById('editActions');

}

function homePage(){return `<section class="page active selector" id="home"><div class="selectorHero"><span class="hello">Hello?</span><div class="eyebrow">${DATA.config.month_label} · Team Huddle</div><h1>Who are you?</h1><p>${DATA.config.opening_prompt||'Pick Team for the store huddle, or jump straight into your own page for numbers, coaching, SBS history, pace and comp.'}</p></div><div class="profiles"><button class="profile team" data-profile="store"><div class="who">Team</div><div class="desc">Store scorecard, shoutouts, team coaching and priorities.</div></button>${DATA.reps.map(r=>`<button class="profile" data-rep="${r.slug}"><div class="who">${r.display_name==='Noelle Glenn'?'Noelle':r.display_name}</div><div class="desc">Your scorecard, coaching, SBS history and comp calculator.</div></button>`).join('')}</div>${landingCoachHtml()}<div class="selectorTools"><details class="tool"><summary>How to use Team Huddle</summary><div class="inside"><b>Team</b> is the store view. Your name opens your personal page. Current shows live comp. Pace projects the month. Change PPV, AIA, Upgrades or Data and the calculator automatically becomes Sandbox.</div></details>${howComp()}</div></section>`}
function coachCards(rep=null,type='all'){let rows=DATA.coaching.filter(c=>rep?c.rep_slug===rep:!c.rep_slug);if(type==='shout')rows=rows.filter(c=>c.kind==='shoutout');if(type==='coach')rows=rows.filter(c=>c.kind!=='shoutout');return rows.map(c=>`<div class="context ${c.kind==='shoutout'?'shout':''} ${adminPhrase?'adminEditable':''}" ${adminPhrase?`data-edit-coach="${c.id}"`:''}><h3>${c.title}</h3><p>${c.body}</p>${coachingMeta(c)}</div>`).join('')||`<div class="context"><h3>Fresh board</h3><p>No coaching point yet.</p></div>`}

function stickyCards(){
  const team=DATA.coaching.filter(c=>!c.rep_slug);

function bindStickyNotes(){

      start={x:e.clientX,y:e.clientY,l:note.offsetLeft,t:note.offsetTop};note.setPointerCapture(e.pointerId);note.classList.add('dragging');note.style.position='absolute';note.style.width=Math.min(300,zone.clientWidth-12)+'px';
    });
    note.addEventListener('pointermove',e=>{if(!start)return;const maxX=Math.max(0,zone.clientWidth-note.offsetWidth),maxY=Math.max(0,zone.clientHeight-note.offsetHeight);note.style.left=Math.max(0,Math.min(maxX,start.l+e.clientX-start.x))+'px';note.style.top=Math.max(0,Math.min(maxY,start.t+e.clientY-start.y))+'px'});

  });
}

function noteStoreKey(id){return 'huddleFloatNote:'+id}
function bindFloatingNotes(){
  const classic=localStorage.getItem('huddleView')==='classic';
  document.body.classList.toggle('classicView',classic);
  document.body.classList.toggle('whiteboardMode',!classic);

  const toggle=document.getElementById('viewToggle');
  if(toggle){
    toggle.textContent=classic?'Whiteboard View':'Classic View';
    toggle.onclick=()=>{
      const next=!document.body.classList.contains('classicView');
      document.body.classList.toggle('classicView',next);
      document.body.classList.toggle('whiteboardMode',!next);
      localStorage.setItem('huddleView',next?'classic':'whiteboard');
      toggle.textContent=next?'Whiteboard View':'Classic View';
      document.body.classList.toggle('teamNotesActive',!next && document.getElementById('store')?.classList.contains('active'));
    };
  }

  const layer=document.getElementById('floatNotesLayer');
  const hidden=new Set(JSON.parse(localStorage.getItem('huddleHiddenNotes')||'[]'));
  const detached=new Set(JSON.parse(localStorage.getItem('huddleDetachedNotes')||'[]'));

  const saveSet=(key,set)=>localStorage.setItem(key,JSON.stringify([...set]));
  const defs=teamNoteDefs();

  function createFloat(n){
    if(!layer || hidden.has(n.id) || !detached.has(n.id))return;
    const note=document.createElement('div');
    note.className=`floatSticky ${n.cls||''}`;
    note.dataset.fnote=n.id;
    note.innerHTML=`<button class="closeSticky" aria-label="Hide note">×</button><h3>${n.title}</h3><p>${n.body}</p><span class="resizeHint">drag · pinch to resize</span>`;
    const saved=JSON.parse(localStorage.getItem(noteStoreKey(n.id))||'null');
    const fallback={x:18,y:110,w:220,h:0};
    const p=saved||fallback;
    note.style.left=Math.max(0,Math.min(window.innerWidth-160,p.x||18))+'px';
    note.style.top=Math.max(0,Math.min(window.innerHeight-100,p.y||110))+'px';
    note.style.width=Math.max(160,Math.min(window.innerWidth*.88,p.w||220))+'px';
    if(p.h)note.style.height=p.h+'px';

    note.querySelector('.closeSticky').onclick=e=>{
      e.stopPropagation();
      hidden.add(n.id); detached.delete(n.id);
      saveSet('huddleHiddenNotes',hidden); saveSet('huddleDetachedNotes',detached);
      note.remove(); paintDock();
    };

    let drag=null,pointers=new Map(),pinch=null;
    note.addEventListener('pointerdown',e=>{
      if(e.target.closest('.closeSticky'))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});note.setPointerCapture(e.pointerId);
      if(pointers.size===1){
        drag={x:e.clientX,y:e.clientY,l:note.offsetLeft,t:note.offsetTop};
        note.classList.add('dragging');
      }
      if(pointers.size===2){
        const a=[...pointers.values()];
        pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),w:note.offsetWidth};
        drag=null;
      }
    });
    note.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size>=2&&pinch){
        const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
        const scale=Math.max(.7,Math.min(2,d/(pinch.d||1)));
        note.style.width=Math.max(160,Math.min(window.innerWidth*.9,pinch.w*scale))+'px';
        note.style.height='auto'; return;
      }
      if(drag&&pointers.size===1){
        const x=Math.max(0,Math.min(window.innerWidth-note.offsetWidth,drag.l+e.clientX-drag.x));
        const y=Math.max(0,Math.min(window.innerHeight-note.offsetHeight,drag.t+e.clientY-drag.y));
        note.style.left=x+'px'; note.style.top=y+'px';
      }
    });
    const end=e=>{
      pointers.delete(e.pointerId);
      if(pointers.size<2)pinch=null;
      if(!pointers.size){
        drag=null;note.classList.remove('dragging');
        localStorage.setItem(noteStoreKey(n.id),JSON.stringify({x:note.offsetLeft,y:note.offsetTop,w:note.offsetWidth,h:note.offsetHeight}));
      }
    };
    note.addEventListener('pointerup',end);note.addEventListener('pointercancel',end);
    layer.appendChild(note);
  }

  defs.forEach(createFloat);

  let dockIndex=0;
  function paintDock(){
    const dock=document.getElementById('noteDock');
    if(!dock)return;
    const notes=visibleDockNotes();
    if(!notes.length){
      dock.innerHTML=`<div class="noteDockCard"><h3>Notes cleared</h3><p>No active notes are sitting in the tray right now.</p><div class="noteDockMeta"><span>Hidden notes stay hidden only on this device.</span></div></div>`;
      return;
    }
    dockIndex=Math.max(0,Math.min(dockIndex,notes.length-1));
    const n=notes[dockIndex];
    dock.innerHTML=`<div class="noteDockCard ${n.cls||''}" data-dock-note="${n.id}">
      <button class="closeSticky" aria-label="Hide note">×</button>
      <h3>${n.title}</h3><p>${n.body}</p>
      <div class="noteDockMeta"><span>${dockIndex+1} of ${notes.length}</span><button class="noteDockDrag" type="button">Move onto board</button></div>
    </div>`;
    const card=dock.querySelector('.noteDockCard');
    card.querySelector('.closeSticky').onclick=e=>{
      e.stopPropagation(); hidden.add(n.id); saveSet('huddleHiddenNotes',hidden); paintDock();
    };
    card.querySelector('.noteDockDrag').onclick=()=>{
      detached.add(n.id); saveSet('huddleDetachedNotes',detached);
      createFloat(n); paintDock();
    };
  }

  document.querySelector('[data-note-prev]')?.addEventListener('click',()=>{
    const n=visibleDockNotes().length;if(!n)return;dockIndex=(dockIndex-1+n)%n;paintDock();
  });
  document.querySelector('[data-note-next]')?.addEventListener('click',()=>{
    const n=visibleDockNotes().length;if(!n)return;dockIndex=(dockIndex+1)%n;paintDock();
  });
  paintDock();

  window.restoreTeamNotes=()=>{
    localStorage.removeItem('huddleHiddenNotes');
    localStorage.removeItem('huddleDetachedNotes');
    [...document.querySelectorAll('.floatSticky')].forEach(n=>n.remove());
    location.reload();
  };
}
