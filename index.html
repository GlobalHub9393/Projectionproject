function compMultiplier(acc,ins){const a=acc>=60,i=ins>=.60;return a&&i?1.5:(a||i?1.25:1)}
function compCalc(m,pace=false,multiplierOverride=null){

  const production=(ppv*base+aia*base*COMP.aiaMultiplier)*mult;

  const prepaidUnits=pace?Math.round((m.prepaid||0)*factor):(m.prepaid||0);
  const spiffs=aiaSubUnits*COMP.aiaSubmit+pre2postUnits*COMP.pre2post+prepaidUnits*COMP.prepaid;
  return {total:production+spiffs,base,mult,production,spiffs,ppv,aia,upg,data,aiaSubUnits,pre2postUnits,prepaidUnits}
}

repaid $5. Projected spiffs use whole projected events; unconfirmed spiff types are excluded until rechecked. Planning estimate only — official payroll wins if anything differs.</div></details></div></details>`
}


function countProjection(v){return v/Math.max(1,DATA.dayOfMonth)*DATA.monthDays}
function remainingDays(){return Math.max(1,DATA.monthDays-DATA.dayOfMonth)}
function managerPathCard(label,current,goal,{action='',adjustTraffic=true}={}){const proj=countProjection(current),adj=adjustTraffic?adjusted(goal):goal,gap=Math.max(0,goal-current),perDay=gap/remainingDays(),adjGap=Math.max(0,adj-current),adjPer=adjGap/remainingDays();const good=proj>=adj;return `<div class="path-card"><div class="path-head"><h3>${label}</h3><span class="pill ${good?'good':'build'}">${good?'On adjusted pace':'Needs a push'}</span></div><div class="path-number">${current} / ${goal}</div><div class="path-line">Projected EOM: <strong>${proj.toFixed(1)}</strong> · Traffic-adjusted target: <strong>${Math.round(adj)}</strong></div><div class="path-line">To base goal: <strong>${gap}</strong> more · ${perDay.toFixed(2)}/day remaining</div>${adjustTraffic?`<div class="path-line">To adjusted goal: <strong>${Math.ceil(adjGap)}</strong> more · ${adjPer.toFixed(2)}/day remaining</div>`:''}${action?`<div class="path-action"><strong>Path:</strong> ${action}</div>`:''}</div>`}
function managerPathSection(){const s=DATA.store;return `<div class="goal-path">${managerPathCard('PPV',s.ppv,DATA.goals.ppv,{action:'Re-rate every account and deliberately look for the fourth line / additional user.'})}${managerPathCard('AIA Submits',s.aiaSubmits,DATA.goals.aiaSubmits,{action:'Use the 8/11 same-day Internet Air take-home experience as a reason to ask every household.'})}${managerPathCard('AIA Posted',s.aiaPosted,DATA.goals.aiaPosted,{action:'In-store inventory now lets us submit and post on the same day. Start the conversation and make it easy.'})}${managerPathCard('HTP',s.htp,DATA.goals.htp,{action:'Make the offer habitual. The rate is already close to 5%; frequency is the lever.'})}${managerPathCard('Upgrades',s.upgrades,DATA.goals.upgrades,{action:'Upgrade volume is healthy. Keep it, but attach accessories, protection, trade and data.'})}${managerPathCard('Data',s.data,DATA.goals.data,{action:'Use watches/tablets/connected devices inside rerates and multi-upgrade conversations.'})}</div>`}

  return `<h1>${rep.name} — Side-by-Side Coaching Brief</h1><div class="muted">Coaching history through ${d.last} · ${d.count} observations</div>
  <div class="box"><div class="smallcaps">Overall Snapshot</div><div class="score">${d.coachingScore}/100</div><div class="mini">${d.trendIcon} ${d.trend} · Coaching confidence ${d.confidence}</div><ul class="compact-list"><li><strong>Summary:</strong> ${d.review.summary}</li><li><strong>Biggest Improvement:</strong> ${d.review.biggestImprovement}</li><li><strong>Biggest Opportunity:</strong> ${d.review.biggestOpportunity}</li><li><strong>Next Focus:</strong> ${d.review.nextFocus}</li></ul></div>
  <div class="box"><h2>Current Coaching Conversation</h2><ul class="compact-list"><li><strong>Celebrate:</strong> ${d.talking.celebrate}</li><li><strong>Coach:</strong> ${d.talking.coach}</li><li><strong>Challenge:</strong> ${d.talking.challenge}</li></ul><h3>Top Priorities</h3><ol class="compact-list">${d.priorities.map(x=>`<li>${x}</li>`).join('')}</ol><h3>Behavior Trend Snapshot</h3><ul class="compact-list">${compactBehaviors}</ul></div>
  <div class="pagebreak"></div><h1>${rep.name} — Observation Timeline</h1><div class="muted">Quick synopsis by Side-by-Side date</div><div class="box timeline-print">${dates}</div><div class="box"><h3>Manager Takeaway</h3><p class="mini">${d.insights.slice(0,3).join(' ')}</p></div>`
}
function openPrintView(kind,id){const rep=DATA.reps.find(r=>r.id===id);let body=kind==='metrics'?metricsBody(id):kind==='sbs'?sbsBody(id):metricsBody(id)+`<div class="pagebreak"></div>`+sbsBody(id);const win=window.open('','_blank');if(!win)return;win.document.open();win.document.write(printShell(`${rep?rep.name:'Store'} PDF`,body));win.document.close()}

function archiveStat(item){return `<div class="archive-stat"><span>${item.label}</span><b>${item.value}</b><small>${item.goal?item.goal+' · ':''}${item.status||'Final'}</small></div>`}
function archiveStorePane(){return `<article class="archive-pane active" id="archive-store"><div class="archive-hero"><h2>Store · July 2026 Final</h2><p>Finished-month snapshot. No pacing or projections.</p></div><div class="archive-metrics">${JULY.store.metrics.map(archiveStat).join('')}</div><div class="section">Final Shoutouts</div><div class="context-grid">${JULY.store.shoutouts.map((x,i)=>contextCard('win',i===0?'July Close':i===1?'Upgrade Volume':i===2?'HTP':'Protection',x)).join('')}</div><div class="card" style="margin-top:10px"><div class="body small">${JULY.store.note}</div></div><div class="section">July Awards</div>${julyAwardsHtml()}</article>`}
function archiveRepPane(id){const r=JULY.reps[id];return `<article class="archive-pane" id="archive-${id}" data-private-archive="${id}"><div class="archive-hero"><h2>${r.name} · July 2026 Final</h2><p>Private finished-month archive.</p></div><div class="archive-metrics">${r.metrics.map(archiveStat).join('')}</div><div class="section">Final Shoutouts</div><div class="context-grid">${r.shoutouts.map((x,i)=>contextCard('win',i===0?'July Recognition':'Final Note',x)).join('')}</div>${r.awards.length?`<div class="section">Awards</div><div class="badges">${r.awards.map(a=>`<span class="badge" style="background:#0c4a6e;color:#fff">🏆 ${a}</span>`).join('')}</div>`:''}</article>`}
function julyAwardsHtml(){return `<div class="awardstage">${JULY.awards.map(a=>`<div class="award"><div class="icon">${a[0]}</div><div><h3>${a[1]} — ${a[2]}</h3><p>${a[3]}</p></div></div>`).join('')}</div>`}
function archivePage(){return `<section class="page" id="archive"><div class="hero"><div class="eyebrow">Finished Months</div><h1>Archive</h1><p>July is frozen: final captured results, awards, and shareable closeouts. Compensation is intentionally left out for now.</p></div><div class="archive-select"><button type="button" class="active" data-archive-select="store">Store</button>${DATA.reps.map(r=>`<button type="button" data-archive-select="${r.id}">🔒 ${r.short}</button>`).join('')}</div>${archiveStorePane()}${DATA.reps.map(r=>archiveRepPane(r.id)).join('')}</section>`}
function showArchiveTarget(id){showPage('archive');document.querySelectorAll('[data-archive-select]').forEach(b=>b.classList.toggle('active',b.dataset.archiveSelect===id));document.querySelectorAll('.archive-pane').forEach(p=>p.classList.toggle('active',p.id==='archive-'+id));}
function requestArchive(id){if(id==='store'){showArchiveTarget('store');return}requestRep(id,()=>showArchiveTarget(id))}
function buildJulyPrint(id){if(id==='store'){const rows=JULY.store.metrics.map(x=>`<tr><th>${x.label}</th><td>${x.value}</td><td>${x.goal||''}</td></tr>`).join('');const body=`<h1>Store — July 2026 Final</h1><div class="muted">Finished-month archive · no pacing or projections</div><div class="box"><table><thead><tr><th>Metric</th><th>Final</th><th>Goal / Context</th></tr></thead><tbody>${rows}</tbody></table></div><div class="box"><h2>Final Shoutouts</h2><ul class="list">${JULY.store.shoutouts.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="box"><h2>July Awards</h2><ul class="list">${JULY.awards.map(a=>`<li><strong>${a[1]}</strong> — ${a[2]} · ${a[3]}</li>`).join('')}</ul></div>`;return printShell('Store July 2026 Final',body)}const r=JULY.reps[id];const rows=r.metrics.map(x=>`<tr><th>${x.label}</th><td>${x.value}</td><td>${x.status||'Final'}</td></tr>`).join('');const body=`<h1>${r.name} — July 2026 Final</h1><div class="muted">Private finished-month archive</div><div class="box"><table><thead><tr><th>Metric</th><th>Final</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><div class="box"><h2>Final Shoutouts</h2><ul class="list">${r.shoutouts.map(x=>`<li>${x}</li>`).join('')}</ul></div>${r.awards.length?`<div class="box"><h2>Awards</h2><ul class="list">${r.awards.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}`;return printShell(`${r.name} July 2026 Final`,body)}
function openJulyPrint(id){const html=buildJulyPrint(id);const win=window.open('','_blank');if(!win)return;win.document.open();win.document.write(html);win.document.close()}

function adminPage(){return `<section class="page" id="admin"><div class="hero"><div class="eyebrow">Admin</div><h1>Private Access</h1><p>This page requires the universal password.</p></div><div id="adminLocked" class="locked-note">🔒 Admin is locked. Use the universal password to open it.</div><div id="adminContent" hidden><div class="card"><div class="cardhead">Rep Passwords</div><div class="body"><div class="admin-list"><div class="admin-row"><strong>Noelle Glenn</strong><code>Glenn</code></div><div class="admin-row"><strong>TJ</strong><code>TJSchreiner</code></div></div><div class="security-note">These client-side privacy gates protect current rep pages, July rep archives, and rep PDF exports from casual access. They are not secure server authentication.</div></div></div></div></section>`}
function authKey(id){return `teamHuddleAuth:${id}`}
function isUniversalUnlocked(){return sessionStorage.getItem(authKey('universal'))==='1'}
function isRepUnlocked(id){return isUniversalUnlocked()||sessionStorage.getItem(authKey(id))==='1'}
function openAuth(kind,id,after){pendingAuth={kind,id,after};const overlay=document.getElementById('authOverlay'),title=document.getElementById('authTitle'),help=document.getElementById('authHelp'),pw=document.getElementById('authPassword'),err=document.getElementById('authError');if(title)title.textContent=kind==='admin'?'Unlock Admin':`Unlock ${DATA.reps.find(r=>r.id===id)?.short||'Rep'} Profile`;if(help)help.textContent=kind==='admin'?'Enter the universal password.':'Enter the rep password or the universal password.';if(err)err.textContent='';if(pw)pw.value='';if(overlay)overlay.hidden=false;setTimeout(()=>pw&&pw.focus(),50)}
function closeAuth(){const overlay=document.getElementById('authOverlay');if(overlay)overlay.hidden=true;pendingAuth=null}
function unlockRep(id){sessionStorage.setItem(authKey(id),'1');document.getElementById('repWelcome')?.setAttribute('hidden','');document.querySelectorAll('.rep').forEach(x=>x.classList.remove('active'));document.getElementById('rep-'+id)?.classList.add('active');document.querySelectorAll('[data-rep-lock]').forEach(x=>x.classList.toggle('active',x.dataset.repLock===id))}
function unlockAdmin(){sessionStorage.setItem(authKey('universal'),'1');const locked=document.getElementById('adminLocked'),content=document.getElementById('adminContent');if(locked)locked.hidden=true;if(content)content.hidden=false}
function requestRep(id,after){if(isRepUnlocked(id)){unlockRep(id);if(after)after();return}openAuth('rep',id,after)}
function requestAdmin(){if(isUniversalUnlocked()){unlockAdmin();showPage('admin');return}openAuth('admin','universal',()=>{unlockAdmin();showPage('admin')})}

function render(){appEl.innerHTML=huddlePage()+storePage()+teamPage()+sharePage()+archivePage()+adminPage()+`<div class="footer">Team Huddle · August Finish Strong · Updated ${DATA.updated}</div>`;renderNav();bindEvents()}
function bindEvents(){document.querySelectorAll('[data-external-promos]').forEach(b=>b.onclick=()=>window.open('https://globaltradetool.com','_blank','noopener'));navEl.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;if(b.dataset.page==='admin'){requestAdmin();return}showPage(b.dataset.page)});document.querySelectorAll('[data-archive-target]').forEach(b=>b.addEventListener('click',()=>requestArchive(b.dataset.archiveTarget)));document.querySelectorAll('[data-archive-select]').forEach(b=>b.addEventListener('click',()=>requestArchive(b.dataset.archiveSelect)));document.querySelectorAll('[data-rep-lock]').forEach(b=>b.addEventListener('click',()=>requestRep(b.dataset.repLock)));let filter='All';const search=document.getElementById('promoSearch');const apply=()=>{const q=(search?.value||'').toLowerCase();document.querySelectorAll('.promo').forEach(p=>{p.hidden=!((filter==='All'||p.dataset.cat===filter)&&p.dataset.text.includes(q))})};if(search)search.addEventListener('input',apply);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()}));document.querySelectorAll('[data-print]').forEach(b=>b.addEventListener('click',()=>openPrintView(b.dataset.print,b.dataset.target)));document.querySelectorAll('[data-private-print]').forEach(b=>b.addEventListener('click',()=>requestRep(b.dataset.target,()=>openPrintView(b.dataset.privatePrint,b.dataset.target))));document.querySelectorAll('[data-july-print]').forEach(b=>b.addEventListener('click',()=>openJulyPrint(b.dataset.julyPrint)));document.querySelectorAll('[data-private-july-print]').forEach(b=>b.addEventListener('click',()=>requestRep(b.dataset.privateJulyPrint,()=>openJulyPrint(b.dataset.privateJulyPrint))));const form=document.getElementById('authForm'),cancel=document.getElementById('authCancel');if(cancel)cancel.addEventListener('click',closeAuth);if(form)form.addEventListener('submit',e=>{e.preventDefault();if(!pendingAuth)return;const pw=document.getElementById('authPassword')?.value||'',err=document.getElementById('authError');const ok=pendingAuth.kind==='admin'?pw===AUTH.universal:(pw===AUTH.universal||pw===AUTH.reps[pendingAuth.id]);if(!ok){if(err)err.textContent='That password did not match.';return}const action=pendingAuth.after,id=pendingAuth.id,kind=pendingAuth.kind;if(pw===AUTH.universal)sessionStorage.setItem(authKey('universal'),'1');else if(kind==='rep')sessionStorage.setItem(authKey(id),'1');closeAuth();if(kind==='rep')unlockRep(id);if(action)action()})}

    21:{title:'👀 Friday Check-In',prompt:'After you read the huddle, react to TJ’s text with 🛜.',example:'Secret reaction for today: 🛜',body:'',button:'📱 Open Messages',mode:'emoji'},

    25:{title:'🧠 Product Confidence',prompt:'Text TJ the product or service you feel least confident explaining.',example:'That becomes a coaching opportunity, not a problem.',body:'The product/service I want more confidence with: ',button:'📱 Text TJ'},
    26:{title:'🎯 Personal Standard',prompt:'Text TJ one behavior you want customers to be able to count on from you every time.',example:'Greeting, discovery, education, bundle, walk-out — your choice.',body:'The behavior I want to be known for: ',button:'📱 Text TJ'},
    27:{title:'📊 Read the Scoreboard',prompt:'Text TJ the store metric you think deserves the most attention right now.',example:'Use the report card before answering.',body:'The store metric I think needs the most attention: ',button:'📱 Text TJ'},
    28:{title:'👀 Friday Check-In',prompt:'After you read the huddle, react to TJ’s text with 🎧.',example:'Secret reaction for today: 🎧',body:'',button:'📱 Open Messages',mode:'emoji'},
    29:{title:'🏆 Shout Someone Out',prompt:'Text TJ one teammate win you have noticed this month.',example:'Numbers, effort, customer care, or improvement all count.',body:'A teammate shoutout I noticed: ',button:'📱 Text TJ'},
    30:{title:'🔄 What Would You Redo?',prompt:'Text TJ one recent customer interaction you would handle differently if you had it again.',example:'Keep it short — what would you change?',body:'One interaction I would handle differently: ',button:'📱 Text TJ'},
    31:{title:'🏁 Finish the Month',prompt:'Text TJ one thing you are proud of from August and one thing you want to carry into September.',example:'One win + one next step.',body:'August win / September focus: ',button:'📱 Text TJ'}
  };
  const d=new Date();

  const prompt=document.getElementById('checkinPrompt');
  const example=document.getElementById('checkinExample');
  const link=document.getElementById('checkinText');

  if(prompt)prompt.textContent=item.prompt;

    link.href=item.mode==='emoji'?'sms:':'sms:&body='+encodeURIComponent(item.body||'');

function setupFinishStrongCheckin(){const title=document.getElementById('checkinTitle'),prompt=document.getElementById('checkinPrompt'),example=document.getElementById('checkinExample'),link=document.getElementById('checkinText');if(title)title.textContent='🏁 Finish Strong';if(prompt)prompt.textContent='After you read the huddle, text TJ the one part of the complete sale you are going to own today.';if(example)example.textContent='Accessories · Insurance · AIA · HTP · Trade — pick one and finish the interaction.';if(link){link.textContent='📱 Text TJ';link.href='sms:&body='+encodeURIComponent('Today I am going to own: ');}}
render();setupCheckin();setupFinishStrongCheckin();
