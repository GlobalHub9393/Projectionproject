const appEl=document.getElementById('app');
const navEl=document.getElementById('nav');
let currentPage='huddle';

const money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:Number.isInteger(v)?0:2}).format(v);
const pct=v=>v==null?'No result':(v*100).toFixed(v*100%1?1:0)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function renderNav(){navEl.innerHTML=pages.map(([id,label])=>`<button type="button" data-page="${id}" class="${currentPage===id?'active':''}">${label}</button>`).join('')}
function showPage(id){currentPage=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
function progress(current,goal){return Math.max(0,Math.min(100,(current/goal)*100))}
function statusPill(current,target,qual=null){if(current>=target)return '<span class="pill good">At target</span>';if(qual!=null&&current>=qual)return '<span class="pill build">Paid · building to target</span>';return '<span class="pill focuspill">Needs attention</span>'}
function metricCard(label,value,sub=''){return `<div class="card metric"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}

function goalPanel(label,current,goal,displayCurrent=current,displayGoal=goal,sub=''){return `<details class="panel"><summary><span>${label}</span><span class="summary-main"><span class="summary-sub">${displayCurrent} / ${displayGoal}${sub?' · '+sub:''}</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="goalrow"><strong>${displayCurrent}</strong><span class="small">Monthly goal ${displayGoal}</span></div><div class="progress"><span style="width:${progress(current,goal)}%"></span></div></div></details>`}

function repMetricRows(r){const m=r.metrics;return [['PPV',m.ppv],['AIA Posted',m.aiaPosted],['AIA Submits',m.aiaSubmits],['AIA Close',pct(m.aiaClose)],['HTP',m.htp],['Upgrades',m.upgrades],['Data',m.data],['CRU',m.cru],['Accessory Revenue',money(m.accRev)],['ACC / OPP',money(m.accPerOpp)],['Insurance',pct(m.insurance)],['Next Up',pct(m.nextUp)],['CSAT',pct(m.csat)],['Prepaid → Postpaid',m.pre2post],['PA4',m.pa4],['OPPs',m.opps],['Trade',pct(m.trade)]].map(([a,b])=>`<div class="devstat"><span>${a}</span><strong>${b}</strong></div>`).join('')}

function behaviorGroups(dev){return ['strength','improving','watch','recurring'].map(status=>{const list=dev.behaviors.filter(b=>b.status===status);if(!list.length)return '';const [icon,label,cls]=statusInfo[status];return `<div class="behavior-group"><h4>${icon} ${label}</h4>${list.map(b=>`<details class="behavior-card"><summary><div class="summary-main"><strong>${b.name}</strong><div class="behavior-meta"><span class="pill ${cls}">${b.frequency}</span><span class="pill info">Last ${b.last}</span><span class="pill info">${b.trend}</span></div></div><span class="chev">⌄</span></summary><div class="behavior-notes">${b.notes.map(n=>`<div class="note-row"><b>${n.date}</b><span>${n.text}</span></div>`).join('')}</div></details>`).join('')}</div>`}).join('')}
function timeline(dev){return `<div class="timeline">${dev.timeline.map(t=>`<div class="event"><span class="dot"></span><div class="eventbox"><details><summary><strong>${t.date} · Score ${t.score}</strong><div class="chips">${t.wins.map(x=>`<span class="chip win">✔ ${x}</span>`).join('')}${t.misses.map(x=>`<span class="chip miss">✖ ${x}</span>`).join('')}</div></summary><div class="event-detail"><strong>Coach</strong><p>${t.coach}</p><div class="rating-grid">${Object.entries(t.ratings).map(([k,v])=>`<div class="rating"><span>${k}</span><b>${v}</b></div>`).join('')}</div></div></details></div></div>`).join('')}</div>`}
function reviewContent(r){const x=r.development.review;return `<div class="conference"><div><strong>Summary</strong>${x.summary}</div><div><strong>Biggest Improvement</strong>${x.biggestImprovement}</div><div><strong>Biggest Opportunity</strong>${x.biggestOpportunity}</div><div><strong>Wins</strong><ul class="clean">${x.wins.map(w=>`<li>${w}</li>`).join('')}</ul></div><div class="talk"><strong>Next Coaching Focus</strong>${x.nextFocus}</div></div>`}
function sideBySideSection(r){if(!r.development)return `<details class="panel"><summary><span>👀 Side-by-Side Coaching</span><span class="summary-main"><span class="summary-sub">No observations loaded for TJ</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="empty">No Side-by-Side history has been added for TJ. Coaching confidence remains Low until observations are available.</div></div></details>`;const d=r.development;return `<details class="panel" open><summary><span>👀 Side-by-Side Coaching</span><span class="summary-main"><span class="summary-sub">Snapshot, behavior trends, talking points, and timeline</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="snapshot"><div class="devstat"><span>Coaching Score</span><div class="score-ring" style="--score:${d.coachingScore}"><strong>${d.coachingScore}</strong></div></div><div class="devstat"><span>Trend</span><strong>${d.trendIcon} ${d.trend}</strong></div><div class="devstat"><span>Side-by-Sides</span><strong>${d.count}</strong></div><div class="devstat"><span>Last Observation</span><strong>${d.last}</strong></div><div class="devstat"><span>Confidence</span><strong>${d.confidence}</strong></div></div><details class="panel" open><summary><span>🎯 Coaching Priorities</span><span class="summary-main"><span class="summary-sub">Automatically ranked from recurring patterns</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="priority-list">${d.priorities.map(p=>`<div class="priority">${p}</div>`).join('')}</div></div></details><details class="panel" open><summary><span>💬 Today’s Coaching Conversation</span><span class="summary-main"><span class="summary-sub">Celebrate first, coach the pattern, set the challenge</span></span><span class="chev">⌄</span></summary><div class="inside conference"><div class="celebrate"><strong>Celebrate</strong>“${d.talking.celebrate}”</div><div class="coach"><strong>Coach</strong>“${d.talking.coach}”</div><div class="challenge"><strong>Challenge</strong>“${d.talking.challenge}”</div></div></details><details class="panel"><summary><span>🏆 Shoutouts</span><span class="summary-main"><span class="summary-sub">Wins worth reinforcing</span></span><span class="chev">⌄</span></summary><div class="inside"><ul class="clean">${d.shoutouts.map(x=>`<li>${x}</li>`).join('')}</ul></div></details><details class="panel"><summary><span>🧭 Behavior Trends</span><span class="summary-main"><span class="summary-sub">Frequency, last observed, trend, and every related note</span></span><span class="chev">⌄</span></summary><div class="inside behavior-groups">${behaviorGroups(d)}</div></details><details class="panel"><summary><span>🗓 Observation Timeline</span><span class="summary-main"><span class="summary-sub">Tap a date for scores, wins, misses, and coaching</span></span><span class="chev">⌄</span></summary><div class="inside">${timeline(d)}</div></details><details class="panel"><summary><span>🧠 Coaching Insights</span><span class="summary-main"><span class="summary-sub">What the observation history is saying</span></span><span class="chev">⌄</span></summary><div class="inside">${d.insights.map(x=>`<div class="insight">${x}</div>`).join('')}<div class="insight"><strong>Knowledge → Execution</strong><br>${d.correlation}</div></div></details><details class="panel"><summary><span>📓 Coaching Journal</span><span class="summary-main"><span class="summary-sub">Formal meetings, commitments, and follow-up</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="empty">No formal journal entry or one-on-one commitment has been loaded into this version yet. Suggested talking points above are generated from the observation history and are not recorded commitments.</div></div></details><details class="panel"><summary><span>📄 Monthly Review Generator</span><span class="summary-main"><span class="summary-sub">One-click coaching summary</span></span><span class="chev">⌄</span></summary><div class="inside"><button type="button" class="review-btn" data-review="${r.id}">Generate ${r.short}’s Review</button><div class="review-box" id="review-${r.id}">${reviewContent(r)}</div></div></details><div class="small" style="margin-top:10px">Scoring note: Observation Score is the AT&T 1–3 total out of 18. Coaching Score normalizes “On Track” as the expectation and adds a penalty for recurring habits. Momentum compares the latest observation to the previous one.</div></div></details>`}
function teamPage(){return `<section class="page" id="team"><div class="hero"><div class="eyebrow">Team Performance</div><h1>Rep Report Cards</h1><p>Metrics stay condensed. Side-by-Side coaching opens into the full teacher-conference view.</p></div><div class="repselect">${DATA.reps.map((r,i)=>`<button type="button" class="${i===0?'active':''}" data-rep="${r.id}">${r.short}</button>`).join('')}</div>${DATA.reps.map((r,i)=>`<article class="rep ${i===0?'active':''}" id="rep-${r.id}"><div class="repbanner"><h2>${r.name}</h2><p>August report card · ${r.development?`${r.development.trendIcon} ${r.development.trend} coaching trend`:'Manager profile'}</p>${r.awards.length?`<div class="badges">${r.awards.map(a=>`<span class="badge">🏆 ${a}</span>`).join('')}</div>`:''}</div><details class="panel" open><summary><span>🎯 Current Focus</span><span class="summary-main"><span class="summary-sub">Shoutout first, then the opportunity</span></span><span class="chev">⌄</span></summary><div class="inside conference">${r.focus.map((x,j)=>`<div class="${j===0?'celebrate':j===1?'coach':'challenge'}"><strong>${j===0?'Shoutout':j===1?'Build':'Opportunity'}</strong>${x}</div>`).join('')}</div></details><details class="panel"><summary><span>📊 August Metrics</span><span class="summary-main"><span class="summary-sub">PPV close is store-only and is not shown for reps</span></span><span class="chev">⌄</span></summary><div class="inside"><div class="devrow">${repMetricRows(r)}</div></div></details>${sideBySideSection(r)}</article>`).join('')}</section>`}
function promosPage(){const cats=['All',...new Set(DATA.promotions.map(p=>p.category))];return `<section class="page" id="promos"><div class="hero"><div class="eyebrow">Knowledge Base</div><h1>Promotions Hub</h1><p>Search or filter, then open only the details you need. Final eligibility should be verified in the approved tools.</p></div><div class="promo-controls"><input id="promoSearch" aria-label="Search promotions" placeholder="Search iPhone Air, Fold8, Internet Air…">${cats.map((x,i)=>`<button type="button" class="filter ${i===0?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="promoList" class="promo-list">${DATA.promotions.map(p=>`<details class="panel promo" data-cat="${p.category}" data-text="${esc([p.title,p.category,p.best,p.summary,...p.details,p.tip].join(' ').toLowerCase())}"><summary><span class="summary-main"><strong>${p.title}</strong><span class="summary-sub">${p.category} · ${p.best}</span></span><span class="promo-status">${p.status}</span><span class="chev">⌄</span></summary><div class="inside conference"><div><strong>Quick Read</strong>${p.summary}</div><div><strong>Rules</strong><ul class="clean">${p.details.map(d=>`<li>${d}</li>`).join('')}</ul></div><div class="talk"><strong>Talking Point</strong>${p.tip}</div></div></details>`).join('')}</div></section>`}
function awardsPage(){return `<section class="page" id="awards"><div class="awardstage"><div class="eyebrow" style="text-align:center">July 2026 · Archived Recognition</div><h1>Team Awards</h1>${[['🎯','The Closer','Jamie McGloan','Most opportunities worked'],['📈','Most Improved','Noelle Glenn','Consistency, growth, and confidence'],['🤝','Support Player','Noelle Glenn','83% Insurance · 100% CSAT'],['⚔️','Offensive Player','Jamie McGloan','Revenue production across PPV, AIA, data, and accessories'],['🏆','MVP','Jamie McGloan','TJ’s selection']].map(a=>`<div class="award"><div class="icon">${a[0]}</div><div><h3>${a[1]} — ${a[2]}</h3><p>${a[3]}</p></div></div>`).join('')}</div></section>`}
function render(){appEl.innerHTML=huddlePage()+storePage()+teamPage()+promosPage()+awardsPage()+`<div class="footer">Team Huddle #2 · Q3 Final Month · Updated ${DATA.updated}</div>`;renderNav();bindEvents()}
function bindEvents(){navEl.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)showPage(b.dataset.page)});document.querySelectorAll('[data-rep]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-rep]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.rep').forEach(x=>x.classList.remove('active'));document.getElementById('rep-'+b.dataset.rep).classList.add('active')}));document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{const box=document.getElementById('review-'+b.dataset.review);box.classList.toggle('open');b.textContent=box.classList.contains('open')?'Hide Review':'Generate '+DATA.reps.find(r=>r.id===b.dataset.review).short+'’s Review'}));let filter='All';const search=document.getElementById('promoSearch');const apply=()=>{const q=(search.value||'').toLowerCase();document.querySelectorAll('.promo').forEach(p=>{p.hidden=!((filter==='All'||p.dataset.cat===filter)&&p.dataset.text.includes(q))})};search.addEventListener('input',apply);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()}))}
function weekEmoji(d){const start=new Date(d.getFullYear(),0,1);const day=Math.floor((d-start)/86400000);return ['📶','🔋','📱','🛜','🎧','⌨️'][Math.floor(day/7)%6]}
function setupCheckin(){const d=new Date();const day=d.getDay();const dateSeed=d.getFullYear()*400+(d.getMonth()+1)*32+d.getDate();const mid=[{p:'Text TJ your PPV and AIA commitment.',e:'Example: “2 PPVs and 1 AIA submit.”'},{p:'Text TJ the metric you are taking ownership of.',e:'Example: “I’m taking ownership of accessories.”'},{p:'Text TJ one behavior you are going to improve.',e:'Example: “I’m slowing down and asking better discovery questions.”'},{p:'Text TJ the conversation you are committed to starting.',e:'Example: “I’m asking every customer about Home Internet.”'}];let prompt,example,body,title='🎯 Huddle Check-In';if(day===1){prompt='Text TJ one thing you want to learn more about or want support on.';example='Example: “I want help getting more confident with business discovery.”';body='One thing I want to learn more about or want support on is: ';}else if(day===5){const em=weekEmoji(d);title='👀 Friday Check-In';prompt=`After you read the huddle, react to TJ’s text post with ${em}.`;example=`This week’s check-in emoji is ${em}. No extra message needed.`;body=em;}else if(day===0||day===6){prompt='Text TJ one win you are building on and one focus you want to carry forward.';example='Example: “Building on protection. Focusing on better discovery.”';body='One win I am building on and one focus I am carrying forward: ';}else{const x=mid[dateSeed%mid.length];prompt=x.p;example=x.e;body=prompt.replace('Text TJ ','')+' ';}document.getElementById('checkinTitle').textContent=title;document.getElementById('checkinPrompt').textContent=prompt;document.getElementById('checkinExample').textContent=example;const link=document.getElementById('checkinText');link.href='sms:?&body='+encodeURIComponent(body);link.addEventListener('click',()=>{const toggle=document.getElementById('checkinToggle');if(toggle)toggle.checked=false})}
render();setupCheckin();
</script>
</body>
</html>
