<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f49"><title>Team Huddle — September</title>
<style>
:root{--navy:#082f49;--blue:#0284c7;--sky:#e0f2fe;--ink:#172033;--muted:#64748b;--line:#dbe4ee;--page:#f4f7fb;--card:#fff;--green:#15803d;--greenbg:#dcfce7;--amber:#a16207;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--navy),#075985);color:#fff;padding:10px;box-shadow:0 3px 18px #082f4930}.toprow{max-width:1180px;margin:auto;display:flex;align-items:center;gap:8px}.brand{font-weight:950}.nav{display:flex;gap:6px;overflow:auto;flex:1}.nav button{border:0;background:#ffffff16;color:#fff;padding:9px 11px;border-radius:10px;font-weight:850;white-space:nowrap}.nav button.active{background:#fff;color:var(--navy)}main{max-width:1180px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,var(--navy),#0369a1);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{margin:2px 0 6px;font-size:clamp(26px,6vw,40px)}.hero p{margin:0;color:#dbeafe}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}.section{font-size:18px;color:var(--navy);font-weight:1000;margin:18px 0 9px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.body{padding:13px}.grid{display:grid;gap:10px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:13px;padding:11px}.metric .label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:950}.metric .value{font-size:23px;font-weight:1000;color:var(--navy);margin:3px 0}.metric.adminEditable{cursor:pointer;position:relative}.metric.adminEditable:hover{outline:2px solid #38bdf8;outline-offset:1px}.inlineEdit{width:100%;font-size:22px;font-weight:1000;color:var(--navy);border:2px solid #38bdf8;border-radius:8px;padding:3px 6px;background:#fff}.adminModeBar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ecfeff;border:1px solid #67e8f9;color:#0c4a6e;border-radius:12px;padding:9px 11px;margin-bottom:10px;font-size:12px;font-weight:850}.adminModeBar button{border:0;background:#0c4a6e;color:#fff;border-radius:8px;padding:7px 10px;font-weight:900}.saveFlash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#0f172a;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:850;box-shadow:0 8px 30px #0003}.goalGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.goalGrid .field{margin:0}.metric .sub{font-size:10px;color:var(--muted)}.good{border-top-color:var(--green)!important}.warn{border-top-color:var(--amber)!important}.bad{border-top-color:var(--red)!important}.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--blue)}.context{padding:12px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;background:#fff}.context h3{margin:0 0 5px;color:var(--navy);font-size:14px}.context p{margin:0;line-height:1.45;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 13px;border-radius:999px;font-weight:900;white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff}.repPane{display:none}.repPane.active{display:block}.repbanner{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;border-radius:17px;padding:16px;margin-bottom:10px}.repbanner h2{margin:0}.repbanner p{margin:5px 0 0;color:#dbeafe}.calc{display:grid;gap:8px}.calcrow{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:6px;align-items:center}.calcrow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.result{padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.sbs{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;overflow:hidden}.sbs summary{padding:11px;font-weight:900;color:var(--navy);cursor:pointer}.sbs .inside{border-top:1px solid var(--line);padding:11px;font-size:13px;line-height:1.5}.scores{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.chip{background:#eef2f6;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}.adminGate{max-width:420px;margin:30px auto}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px}.btn{border:0;background:var(--navy);color:#fff;padding:10px 13px;border-radius:10px;font-weight:900}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:#991b1b}.adminSection{margin-bottom:12px}.adminGrid{display:grid;gap:10px}.status{font-size:12px;color:var(--muted);margin-top:8px}.small{font-size:11px;color:var(--muted)}
/* Manager Mode */
.metric.adminEditable{cursor:pointer;position:relative;padding-right:34px;transition:.15s ease}
.metric.adminEditable:hover,.metric.adminEditable:active{outline:2px solid #38bdf8;outline-offset:1px;transform:translateY(-1px)}
.metric.adminEditable:after{content:"✎";position:absolute;right:10px;top:10px;width:21px;height:21px;display:grid;place-items:center;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:1000}
.managerBar{display:flex;align-items:center;gap:7px;overflow:auto;background:#ecfeff;border:1px solid #67e8f9;border-radius:14px;padding:8px;margin:0 0 10px}
.managerBar .mode{font-size:11px;font-weight:1000;color:#0c4a6e;white-space:nowrap;padding:0 5px}
.managerBar button{border:0;background:#fff;color:#0c4a6e;border:1px solid #bae6fd;border-radius:10px;padding:8px 10px;font-weight:900;white-space:nowrap}
.managerBar button.primary{background:#0c4a6e;color:#fff;border-color:#0c4a6e}
.managerBar button.lock{margin-left:auto;background:#fff1f2;color:#9f1239;border-color:#fecdd3}
.editRepBtn{border:1px solid #bae6fd;background:#fff;color:#075985;border-radius:10px;padding:8px 11px;font-weight:900;margin-top:10px}
.sheetBackdrop{position:fixed;inset:0;background:#0f172a73;z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -20px 60px #0004;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheetHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:#fff;padding:14px 0 10px;z-index:3;border-bottom:1px solid #eef2f7}
.sheetHead h2{margin:0;color:var(--navy);font-size:20px}.sheetHead p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.sheetClose{border:0;background:#f1f5f9;color:#334155;width:34px;height:34px;border-radius:999px;font-weight:1000}
.quickEdit{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;margin:16px 0}
.quickEdit button{height:46px;border:1px solid var(--line);background:#f8fafc;border-radius:12px;font-size:22px;font-weight:1000;color:var(--navy)}
.quickEdit input{width:100%;height:52px;border:2px solid #38bdf8;border-radius:12px;text-align:center;font-size:24px;font-weight:1000;color:var(--navy)}
.sheetActions{display:flex;gap:8px;position:sticky;bottom:-14px;background:#fff;padding:10px 0 14px;border-top:1px solid #eef2f7;margin-top:12px}
.sheetActions .btn{flex:1}
.editGroups{display:grid;gap:12px}.editGroup{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fbfdff}
.editGroup h3{margin:0 0 9px;color:var(--navy);font-size:14px}.editRows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.editRow{display:grid;gap:4px}.editRow label{font-size:10px;text-transform:uppercase;font-weight:950;color:var(--muted)}
.editRow input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.savedToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;background:#0f172a;color:#fff;border-radius:999px;padding:9px 10px 9px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 35px #0004;font-size:12px;font-weight:850}
.savedToast button{border:0;background:#fff;color:#0f172a;border-radius:999px;padding:6px 10px;font-weight:950}
.managerHub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.managerHub button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left;color:var(--navy);font-weight:950}
.managerHub button span{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:3px}
@media(min-width:760px){.sheetBackdrop{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:90vh}.editRows{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media(min-width:760px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:1fr 1fr}.adminGrid{grid-template-columns:1fr 1fr}.calcrow{grid-template-columns:1.6fr .7fr .7fr}.toprow{gap:12px}}
</style></head><body><header class="top"><div class="toprow"><div class="brand">Team Huddle</div><nav class="nav" id="nav"><button class="active" data-page="home">Coaching</button><button data-page="store">Store</button><button data-page="team">Rep Pages</button><button data-page="sbs">SBS</button><button data-page="archives">Awards / Archives</button><button data-page="admin">Edit</button></nav></div></header><main id="app"><div class="hero"><div class="eyebrow">Loading</div><h1>Team Huddle</h1><p>Connecting to September data…</p></div></main>
<script>
let DATA=null,adminPhrase=sessionStorage.getItem('huddleAdmin')||'';const app=document.getElementById('app'),nav=document.getElementById('nav');
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`;const num=n=>Number(n||0).toLocaleString();
async function api(method='GET',body){const r=await fetch('/api/huddle',{method,headers:{'content-type':'application/json',...(adminPhrase?{'x-admin-phrase':adminPhrase}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{DATA=await api();render();}catch(e){app.innerHTML=`<div class="hero"><div class="eyebrow">Connection Problem</div><h1>September Huddle</h1><p>${e.message||'Unable to load data'}</p></div><div class="card"><div class="body"><b>The site could not reach Neon.</b><div class="status">DATABASE_URL is already expected in Vercel. Refresh once after deployment; if this remains, send TJ the exact error shown above.</div></div></div>`}}
function goalClass(v,g){if(!g)return'';const x=Number(v)/Number(g);return x>=1?'good':x>=.75?'warn':'bad'}
function metric(label,value,goal,fmt='num',edit=null){const f=fmt==='money'?money:fmt==='pct'?pct:num;const ratio=goal?Math.min(100,Number(value)/Number(goal)*100):0;const ed=adminPhrase&&edit?` adminEditable`:'',attrs=adminPhrase&&edit?` data-inline-scope="${edit.scope}" data-inline-field="${edit.field}" data-inline-rep="${edit.rep||''}" data-inline-fmt="${fmt}"`:'';return `<div class="metric ${goalClass(value,goal)}${ed}"${attrs}><div class="label">${label}</div><div class="value">${f(value)}</div><div class="sub">${goal?`Goal ${f(goal)}`:'Current'}</div>${goal?`<div class="progress"><span style="width:${ratio}%"></span></div>`:''}</div>`}
function coachingCards(repSlug=null){const rows=DATA.coaching.filter(c=>repSlug?c.rep_slug===repSlug:!c.rep_slug);return rows.map(c=>`<div class="context"><h3>${c.title||c.kind}</h3><p>${c.body}</p></div>`).join('')||`<div class="context"><h3>Fresh board</h3><p>No coaching point added yet.</p></div>`}
function homePage(){const c=DATA.config;return `<section class="page active" id="home"><div class="hero"><div class="eyebrow">${c.month_label} · Fresh Start</div><h1>${c.headline}</h1><p>${c.opening_prompt}</p></div><div class="section">Coaching Board</div><div class="grid">${coachingCards()}</div><div class="section">Team Message</div><div class="context"><p>${c.team_message}</p></div></section>`}
function storePage(){const s=DATA.store,g=DATA.goals;return `<section class="page" id="store">${adminModeBar()}<div class="hero"><div class="eyebrow">Store Scoreboard</div><h1>September</h1><p>Live store numbers vs goal.${adminPhrase?' Manager Mode is on — tap any card with a pencil to edit.':''}</p></div><div class="metrics">${metric('PPV',s.ppv,g.ppv,'num',{scope:'store',field:'ppv'})}${metric('AIA Posted',s.aia_posted,g.aia_posted,'num',{scope:'store',field:'aia_posted'})}${metric('AIA Submits',s.aia_submits,g.aia_submits,'num',{scope:'store',field:'aia_submits'})}${metric('HTP',s.htp,g.htp,'num',{scope:'store',field:'htp'})}${metric('Upgrades',s.upgrades,g.upgrades,'num',{scope:'store',field:'upgrades'})}${metric('Data',s.data,g.data,'num',{scope:'store',field:'data'})}${metric('Accessories / OPP',s.acc_per_opp,g.accessory_target,'money',{scope:'store',field:'acc_per_opp'})}${metric('Insurance',s.insurance_rate,g.insurance_target,'pct',{scope:'store',field:'insurance_rate'})}${metric('Trade',s.trade_rate,g.trade_target,'pct',{scope:'store',field:'trade_rate'})}${metric('CSAT',s.csat,g.csat_target,'pct',{scope:'store',field:'csat'})}${metric('OPPs',s.opps,g.opportunities,'num',{scope:'store',field:'opps'})}${metric('Traffic',s.traffic,g.traffic,'num',{scope:'store',field:'traffic'})}</div></section>`}
function repMetrics(r){const m=r.metrics||{},g=DATA.goals,e=(field,fmt='num')=>({scope:'rep',field,rep:r.slug});return `${metric('PPV',m.ppv,Math.round(g.ppv/Math.max(DATA.reps.length,1)),'num',e('ppv'))}${metric('AIA Submits',m.aia_submits,g.rep_aia_qualifier,'num',e('aia_submits'))}${metric('HTP',m.htp,g.rep_htp_qualifier,'num',e('htp'))}${metric('Upgrades',m.upgrades,null,'num',e('upgrades'))}${metric('Accessories / OPP',m.acc_per_opp,g.accessory_target,'money',e('acc_per_opp'))}${metric('Insurance',m.insurance_rate,g.insurance_target,'pct',e('insurance_rate'))}${metric('Trade',m.trade_rate,g.trade_target,'pct',e('trade_rate'))}${metric('CSAT',m.csat,g.csat_target,'pct',e('csat'))}`}
function needInsured(adds,elig,target){if(!elig)return null;if(adds/elig>=target)return 0;return Math.max(0,Math.ceil((target*elig-adds)/(1-target)-1e-9))}
function needOE(adds,elig,target){if(!elig)return null;return Math.max(0,Math.ceil(target*elig-adds-1e-9))}
function calcHtml(r){const m=r.metrics||{},den=Math.max(0,Number(m.opps||0)-Number(m.data||0));return `<div class="card"><div class="body"><b>Finish-the-Month Calculator</b> <span class="chip">Sandbox — does not save</span><div class="small">Starts with the live rep numbers. Reps can change anything below without affecting Neon.</div><div class="calc" data-calc="${r.slug}" data-base='${JSON.stringify(m).replaceAll("'","&#39;")}'><div class="calcrow"><b>Accessory $ / OPP</b><input type="number" step=".01" data-c="accavg" value="${Number(m.acc_per_opp||0)}"><div class="result" data-r="acc50">—</div></div><div class="calcrow"><b>Eligible OPPs</b><input type="number" data-c="accden" value="${den}"><div class="result" data-r="acc60">—</div></div><div class="calcrow"><b>Insurance %</b><input type="number" step=".01" data-c="insrate" value="${(Number(m.insurance_rate||0)*100).toFixed(2)}"><div class="result" data-r="ins50">—</div></div><div class="calcrow"><b>Total OPPs</b><input type="number" data-c="insopps" value="${Number(m.opps||0)}"><div class="result" data-r="ins60">—</div></div><div class="calcrow"><b>Known Insurance Adds</b><input type="number" data-c="insadds" value="${m.insurance_adds??''}" placeholder="optional"><div class="result" data-r="insnote">—</div></div><div class="calcrow"><b>Known Eligible Insurance OPPs</b><input type="number" data-c="inselig" value="${m.insurance_eligible_opps??''}" placeholder="optional"><div class="result">Exact if known</div></div><div class="section" style="margin:8px 0 4px;font-size:14px">Pay Projection</div><div class="small">I left PPV/AIA payout rates editable until we lock the exact comp formula. Upgrade/Data defaults use the rates we already have.</div><div class="calcrow"><b>PPV payout each</b><input type="number" step=".01" data-c="payppv" value="0"><div class="result" data-r="pay">$0.00</div></div><div class="calcrow"><b>AIA payout each</b><input type="number" step=".01" data-c="payaia" value="0"><div class="result">Editable</div></div><div class="calcrow"><b>Upgrade payout each</b><input type="number" step=".01" data-c="payupg" value="0.10"><div class="result">Current assumption</div></div><div class="calcrow"><b>Data payout each</b><input type="number" step=".01" data-c="paydata" value="0.20"><div class="result">Current assumption</div></div><div class="calcrow"><b>Add PPV / AIA / Upg / Data</b><input type="text" data-c="adds" value="0,0,0,0"><div class="result" data-r="paydetail">0 added</div></div></div></div></div>`}
function repsPage(){return `<section class="page" id="team">${adminModeBar()}<div class="hero"><div class="eyebrow">Rep Pages</div><h1>Individual Pages</h1><p>Numbers, coaching, SBS and the sandbox calculator are open to the team.</p></div><div class="tabs">${DATA.reps.map((r,i)=>`<button class="${i?'':'active'}" data-rep="${r.slug}">${r.display_name}</button>`).join('')}</div>${DATA.reps.map((r,i)=>`<article class="repPane ${i?'':'active'}" id="rep-${r.slug}"><div class="repbanner"><h2>${r.display_name}</h2><p>September live scorecard</p>${adminPhrase?`<button class="editRepBtn" data-edit-rep-sheet="${r.slug}">Edit ${r.display_name}</button>`:''}</div><div class="metrics">${repMetrics(r)}</div><div class="section">Coaching</div><div class="grid">${coachingCards(r.slug)}</div><div class="section">Calculator</div>${calcHtml(r)}<div class="section">Recent SBS</div>${sbsFor(r.slug)}</article>`).join('')}</section>`}
function sbsFor(slug){const rows=DATA.sbs.filter(s=>s.rep_slug===slug);return rows.map(s=>`<details class="sbs"><summary>${s.observed_on?.slice(0,10)||''} · ${s.title||'Side-by-Side'}</summary><div class="inside"><div class="scores">${[['Greet',s.greet],['Understand',s.understand],['Recommend',s.recommend],['Confirm',s.confirm],['Educate',s.educate],['Thank',s.thank]].filter(x=>x[1]!=null).map(x=>`<span class="chip">${x[0]} ${x[1]}</span>`).join('')}</div>${s.coaching_summary?`<b>Coaching:</b> ${s.coaching_summary}<br><br>`:''}${s.notes||''}</div></details>`).join('')||'<div class="context"><p>No SBS entered yet.</p></div>'}
function sbsPage(){return `<section class="page" id="sbs"><div class="hero"><div class="eyebrow">Open SBS</div><h1>Side-by-Sides</h1><p>Visible to the team. Keep adding them and the history grows.</p></div>${DATA.reps.map(r=>`<div class="section">${r.display_name}</div>${sbsFor(r.slug)}`).join('')}</section>`}
function adminModeBar(){return adminPhrase?`<div class="managerBar"><span class="mode">MANAGER MODE</span><button data-manager-go="store">Store</button><button data-manager-go="goals">Goals</button><button data-manager-go="reps">Reps</button><button data-manager-go="coaching">Coaching</button><button data-manager-go="sbs">SBS</button><button class="lock" data-lock-admin>Lock</button></div>`:''}
function adminPage(){if(!adminPhrase)return `<section class="page" id="admin"><div class="adminGate card"><div class="body"><h2 style="margin-top:0">Manager Mode</h2><p class="small">Enter the admin phrase once to unlock editing controls.</p><div class="field"><label>Admin Phrase</label><input id="adminPhrase" type="password" placeholder="Enter phrase" autocomplete="current-password"></div><button class="btn" id="unlockAdmin">Unlock Manager Mode</button><div class="status" id="unlockStatus"></div></div></div></section>`;return `<section class="page" id="admin">${adminModeBar()}<div class="hero"><div class="eyebrow">Manager Mode</div><h1>Quick Edit</h1><p>Keep the regular pages clean. Use these shortcuts when you want to make bigger changes.</p></div><div class="managerHub"><button data-open-store-sheet>Store Numbers<span>Edit the full store scorecard</span></button><button data-open-goals-sheet>September Goals<span>Update them when GM sends the official targets</span></button>${DATA.reps.map(r=>`<button data-edit-rep-sheet="${r.slug}">${r.display_name}<span>Edit the full rep scorecard</span></button>`).join('')}<button data-manager-go="coaching">Coaching<span>Add or update huddle talking points</span></button><button data-manager-go="sbs">SBS<span>Add a side-by-side observation</span></button></div><div class="section" id="manager-coaching">Front Page & Coaching</div><div class="adminGrid"><div class="card"><div class="body"><h3>Front Page</h3>${field('Headline','headline',DATA.config.headline)}${field('Opening Prompt','opening_prompt',DATA.config.opening_prompt,'textarea')}${field('Team Message','team_message',DATA.config.team_message,'textarea')}<button class="btn" data-save-config>Save Front Page</button></div></div><div class="card"><div class="body"><h3>Add Coaching Point</h3><div class="adminGrid">${field('Title','coach_title','')}${selectField('Who','coach_rep',[['','Store'],...DATA.reps.map(r=>[r.slug,r.display_name])])}${selectField('Type','coach_kind',[['c function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}
function flash(msg){let x=document.createElement('div');x.className='saveFlash';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1400)}
let lastUndo=null;
function showSaved(label,undoFn){document.querySelector('.savedToast')?.remove();lastUndo=undoFn||null;const t=document.createElement('div');t.className='savedToast';t.innerHTML=`<span>${label} saved ✓</span>${undoFn?'<button type="button">Undo</button>':''}`;document.body.appendChild(t);if(undoFn)t.querySelector('button').onclick=async()=>{try{await undoFn();t.remove();flash('Change undone');const page=document.querySelector('.page.active')?.id||'store';await load();show(page)}catch(e){flash(e.message)}};setTimeout(()=>t.remove(),10000)}
function closeSheet(){document.querySelector('.sheetBackdrop')?.remove()}
function openSheet(title,subtitle,body,actions=''){closeSheet();const wrap=document.createElement('div');wrap.className='sheetBackdrop';wrap.innerHTML=`<div class="sheet"><div class="sheetHead"><div><h2>${title}</h2><p>${subtitle||''}</p></div><button class="sheetClose" type="button">×</button></div>${body}${actions}</div>`;document.body.appendChild(wrap);wrap.querySelector('.sheetClose').onclick=closeSheet;wrap.onclick=e=>{if(e.target===wrap)closeSheet()};return wrap}
function sourceValue(scope,field,rep){if(scope==='store')return DATA.store[field];return (DATA.reps.find(r=>r.slug===rep)?.metrics||{})[field]}
function toDisplay(v,fmt){return fmt==='pct'?Number(v||0)*100:Number(v||0)}
function fromDisplay(v,fmt){let n=Number(v);if(Number.isNaN(n))throw new Error('Enter a number');return fmt==='pct'?n/100:n}
async function saveSingleMetric(scope,field,rep,fmt,label,newDisplay,oldRaw){const newRaw=fromDisplay(newDisplay,fmt);const payload=scope==='store'?{action:'save_store',fields:{[field]:newRaw}}:{action:'save_rep',rep_slug:rep,fields:{[field]:newRaw}};const undoPayload=scope==='store'?{action:'save_store',fields:{[field]:oldRaw}}:{action:'save_rep',rep_slug:rep,fields:{[field]:oldRaw}};await api('POST',payload);showSaved(label,()=>api('POST',undoPayload))}
function openMetricSheet(card){const scope=card.dataset.editScope,field=card.dataset.editField,rep=card.dataset.editRep,fmt=card.dataset.editFmt,label=card.dataset.editLabel,oldRaw=sourceValue(scope,field,rep),oldDisplay=toDisplay(oldRaw,fmt),suffix=fmt==='pct'?'%':fmt==='money'?' $':'';const wrap=openSheet(`Edit ${label}`,scope==='store'?'Store scorecard':DATA.reps.find(r=>r.slug===rep)?.display_name||'Rep',`<div class="quickEdit"><button type="button" data-minus>−</button><input id="quickEditValue" type="number" step="any" value="${oldDisplay}"><button type="button" data-plus>+</button></div><div class="small">Current value${suffix}: ${Number(oldDisplay||0).toLocaleString()}${fmt==='pct'?'%':''}</div>`,`<div class="sheetActions"><button class="btn alt" type="button" data-cancel>Cancel</button><button class="btn" type="button" data-save>Save</button></div>`);const input=wrap.querySelector('#quickEditValue');const step=fmt==='money'?.5:1;wrap.querySelector('[data-minus]').onclick=()=>input.value=Number(input.value||0)-step;wrap.querySelector('[data-plus]').onclick=()=>input.value=Number(input.value||0)+step;wrap.querySelector('[data-cancel]').onclick=closeSheet;wrap.querySelector('[data-save]').onclick=async()=>{try{await saveSingleMetric(scope,field,rep,fmt,label,input.value,oldRaw);closeSheet();const page=document.querySelector('.page.active')?.id||'store';await load();show(page)}catch(e){flash(e.message)}};input.focus();input.select()}
const pctFields=new Set(['ppv_close','aia_close','htp_close','insurance_rate','nextup_rate','csat','trade_rate','insurance_target','insurance_qualifier','trade_target','csat_target']);

function openGoalsSheet(){const g=DATA.goals,groups=[['Volume',[['Traffic','traffic'],['Opportunities','opportunities'],['PPV','ppv'],['Upgrades','upgrades'],['Data','data']]],['AIA & HTP',[['PPV Close','ppv_close','pct'],['AIA Posted','aia_posted'],['AIA Submits','aia_submits'],['AIA Close','aia_close','pct'],['HTP','htp'],['HTP Close','htp_close','pct']]],['Quality',[['Accessory Target $/OPP','accessory_target'],['Accessory Qualifier $/OPP','accessory_qualifier'],['Insurance Target','insurance_target','pct'],['Insurance Qualifier','insurance_qualifier','pct'],['Trade Target','trade_target','pct'],['CSAT Target','csat_target','pct']]],['Rep Qualifiers',[['AIA Submit Qualifier','rep_aia_qualifier'],['HTP Qualifier','rep_htp_qualifier']]]];const body=`<div class="editGroups">${groups.map(([title,rows])=>`<div class="editGroup"><h3>${title}</h3><div class="editRows">${rows.map(([l,k,t])=>editInput(l,k,g[k],t||'num')).join('')}</div></div>`).join('')}</div>`;const wrap=openSheet('September Goals','Placeholder goals are fine until the official targets arrive.',body,`<div class="sheetActions"><button class="btn alt" type="button" data-cancel>Cancel</button><button class="btn" type="button" data-save>Save All Goals</button></div>`);wrap.querySelector('[data-cancel]').onclick=closeSheet;wrap.querySelector('[data-save]').onclick=async()=>{const fields={},old={};wrap.querySelectorAll('[data-field]').forEach(el=>{const k=el.dataset.field;let v=Number(el.value||0);if(el.dataset.kind==='pct')v/=100;fields[k]=v;old[k]=g[k]});try{await api('POST',{action:'save_goals',fields});showSaved('Goals',()=>api('POST',{action:'save_goals',fields:old}));closeSheet();const page=document.querySelector('.page.active')?.id||'admin';await load();show(page)}catch(e){flash(e.message)}}}
function fullEditGroups(scope,obj){const groups=scope==='store'?[['Core',[['Traffic','traffic'],['PPV','ppv'],['PPV Close','ppv_close','pct'],['AIA Posted','aia_posted'],['AIA Submits','aia_submits'],['AIA Close','aia_close','pct'],['HTP','htp'],['HTP Close','htp_close','pct']]],['Sales',[['Upgrades','upgrades'],['Data','data'],['CRU','cru'],['OPPs','opps'],['PA4','pa4'],['Prepaid','prepaid'],['Open Enrollment','open_enrollment']]],['Quality',[['Accessory Revenue','accessory_revenue'],['ACC / OPP','acc_per_opp'],['Insurance','insurance_rate','pct'],['Next Up','nextup_rate','pct'],['Trade','trade_rate','pct'],['CSAT','csat','pct']]]]:[['Sales',[['PPV','ppv'],['AIA Posted','aia_posted'],['AIA Submits','aia_submits'],['AIA Close','aia_close','pct'],['HTP','htp'],['Upgrades','upgrades'],['Data','data'],['CRU','cru'],['OPPs','opps']]],['Quality',[['Accessory Revenue','accessory_revenue'],['ACC / OPP','acc_per_opp'],['Insurance','insurance_rate','pct'],['Insurance Adds','insurance_adds'],['Eligible Insurance OPPs','insurance_eligible_opps'],['Next Up','nextup_rate','pct'],['Trade','trade_rate','pct'],['CSAT','csat','pct']]],['Other',[['PA4','pa4'],['Prepaid','prepaid'],['Open Enrollment','open_enrollment']]]];return groups.map(([title,rows])=>`<div class="editGroup"><h3>${title}</h3><div class="editRows">${rows.map(([l,k,t])=>editInput(l,k,obj[k],t||'num')).join('')}</div></div>`).join('')}
function openStoreSheet(){const old={...DATA.store};const wrap=openSheet('Edit Store Numbers','Full September store scorecard.',`<div class="editGroups">${fullEditGroups('store',DATA.store)}</div>`,`<div class="sheetActions"><button class="btn alt" type="button" data-cancel>Cancel</button><button class="btn" type="button" data-save>Save Store</button></div>`);wrap.querySelector('[data-cancel]').onclick=closeSheet;wrap.querySelector('[data-save]').onclick=async()=>{const fields={},undo={};wrap.querySelectorAll('[data-field]').forEach(el=>{const k=el.dataset.field;let v=el.value===''?null:Number(el.value);if(el.dataset.kind==='pct'&&v!==null)v/=100;fields[k]=v;undo[k]=old[k]});try{await api('POST',{action:'save_store',fields});showSaved('Store',()=>api('POST',{action:'save_store',fields:undo}));closeSheet();const page=document.querySelector('.page.active')?.id||'store';await load();show(page)}catch(e){flash(e.message)}}}
function openRepSheet(slug){const r=DATA.reps.find(x=>x.slug===slug);if(!r)return;const old={...(r.metrics||{})};const wrap=openSheet(`Edit ${r.display_name}`,'Full September rep scorecard.',`<div class="editGroups">${fullEditGroups('rep',r.metrics||{})}</div>`,`<div class="sheetActions"><button class="btn alt" type="button" data-cancel>Cancel</button><button class="btn" type="button" data-save>Save ${r.display_name}</button></div>`);wrap.querySelector('[data-cancel]').onclick=closeSheet;wrap.querySelector('[data-save]').onclick=async()=>{const fields={},undo={};wrap.querySelectorAll('[data-field]').forEach(el=>{const k=el.dataset.field;let v=el.value===''?null:Number(el.value);if(el.dataset.kind==='pct'&&v!==null)v/=100;fields[k]=v;undo[k]=old[k]});try{await api('POST',{action:'save_rep',rep_slug:slug,fields});showSaved(r.display_name,()=>api('POST',{action:'save_rep',rep_slug:slug,fields:undo}));closeSheet();const page=document.querySelector('.page.active')?.id||'team';await load();show(page);const tab=document.querySelector(`[data-rep="${slug}"]`);if(tab)tab.click()}catch(e){flash(e.message)}}}
function bindManagerMode(){document.querySelectorAll('.metric.adminEditable').forEach(card=>card.onclick=()=>openMetricSheet(card));document.querySelectorAll('[data-open-goals-sheet]').forEach(b=>b.onclick=openGoalsSheet);document.querySelectorAll('[data-open-store-sheet]').forEach(b=>b.onclick=openStoreSheet);document.querySelectorAll('[data-edit-rep-sheet]').forEach(b=>b.onclick=()=>openRepSheet(b.dataset.editRepSheet));document.querySelectorAll('[data-manager-go]').forEach(b=>b.onclick=()=>{const go=b.dataset.managerGo;if(go==='store')show('store');else if(go==='goals')openGoalsSheet();else if(go==='reps')show('team');else if(go==='coaching'){show('admin');setTimeout(()=>document.getElementById('manager-coaching')?.scrollIntoView({behavior:'smooth'}),20)}else if(go==='sbs'){show('admin');setTimeout(()=>document.getElementById('manager-sbs')?.scrollIntoView({behavior:'smooth'}),20)}})}
function lockAdmin(){adminPhrase='';sessionStorage.removeItem('huddleAdmin');render();show('admin')}
function bind(){nav.onclick=e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-rep]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.repPane').forEach(p=>p.classList.toggle('active',p.id==='rep-'+b.dataset.rep))});document.querySelectorAll('[data-lock-admin]').forEach(b=>b.onclick=lockAdmin);bindManagerMode();document.querySelectorAll('[data-calc]').forEach(calc=>{const base=JSON.parse(calc.dataset.base||'{}');const q=s=>calc.querySelector(s),v=k=>Number(q(`[data-c="${k}"]`)?.value||0);const upd=()=>{const avg=v('accavg'),den=Math.max(0,v('accden')),rev=avg*den;const n50=Math.max(0,50*(den+1)-rev),n60=Math.max(0,60*(den+1)-rev);q('[data-r="acc50"]').textContent=`Next OPP: $${n50.toFixed(2)} → $50`;q('[data-r="acc60"]').textContent=`Next OPP: $${n60.toFixed(2)} → $60`;const rate=v('insrate')/100,opps=Math.max(0,Math.round(v('insopps'))),addsEl=q('[data-c="insadds"]'),eligEl=q('[data-c="inselig"]');if(addsEl.value!==''&&eligEl.value!==''){const a=+addsEl.value,e=+eligEl.value;q('[data-r="ins50"]').textContent=`50%: ${needInsured(a,e,.5)} insured or ${needOE(a,e,.5)} OE`;q('[data-r="ins60"]').textContent=`60%: ${needInsured(a,e,.6)} insured or ${needOE(a,e,.6)} OE`;q('[data-r="insnote"]').textContent=`${a}/${e} exact`}else{const cand=[];for(let e=1;e<=opps;e++)for(let a=0;a<=e;a++)if(Math.abs(a/e-rate)<=.0055)cand.push([a,e]);if(cand.length){const range=arr=>{const lo=Math.min(...arr),hi=Math.max(...arr);return lo===hi?`${lo}`:`${lo}-${hi}`};q('[data-r="ins50"]').textContent=`50%: ${range(cand.map(x=>needInsured(x[0],x[1],.5)))} insured`;q('[data-r="ins60"]').textContent=`60%: ${range(cand.map(x=>needInsured(x[0],x[1],.6)))} insured`;q('[data-r="insnote"]').textContent=`Best effort · ${cand.length} possible fractions`}else{q('[data-r="ins50"]').textContent='Need counts';q('[data-r="ins60"]').textContent='Need counts';q('[data-r="insnote"]').textContent='Add exact counts if known'}}const parts=(q('[data-c="adds"]').value||'0,0,0,0').split(',').map(x=>Number(x.trim())||0);const ppv=Number(base.ppv||0)+parts[0],aia=Number(base.aia_posted||0)+parts[1],upg=Number(base.upgrades||0)+parts[2],data=Number(base.data||0)+parts[3],pay=ppv*v('payppv')+aia*v('payaia')+upg*v('payupg')+data*v('paydata');q('[data-r="pay"]').textContent=`$${pay.toFixed(2)}`;q('[data-r="paydetail"]').textContent=`${ppv} PPV · ${aia} AIA · ${upg} Upg · ${data} Data`};calc.querySelectorAll('input').forEach(i=>i.oninput=upd);upd()});const u=document.getElementById('unlockAdmin');if(u)u.onclick=async()=>{const candidate=document.getElementById('adminPhrase').value,st=document.getElementById('unlockStatus');if(!candidate){st.textContent='Enter the admin phrase.';return}const previous=adminPhrase;adminPhrase=candidate;try{await api('POST',{action:'verify_admin'});sessionStorage.setItem('huddleAdmin',candidate);render();show('admin')}catch(e){adminPhrase=previous;sessionStorage.removeItem('huddleAdmin');st.textContent='Incorrect admin phrase.'}};bindAdmin()}

function bindAdmin(){const stat=document.getElementById('adminStatus');const set=s=>{if(stat)stat.textContent=s};const sg=document.querySelector('[data-save-goals]');if(sg)sg.onclick=async()=>{const pctKeys=new Set(['ppv_close','aia_close','htp_close','insurance_target','insurance_qualifier','trade_target','csat_target']),keys=['traffic','opportunities','ppv','ppv_close','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','accessory_target','accessory_qualifier','insurance_target','insurance_qualifier','trade_target','csat_target','rep_aia_qualifier','rep_htp_qualifier'],fields={};for(const k of keys){const el=document.getElementById('goal_'+k);if(el){let v=Number(el.value||0);if(pctKeys.has(k))v/=100;fields[k]=v}}try{await api('POST',{action:'save_goals',fields});set('Goals saved.');await load();show('admin')}catch(e){set(e.message)}};const config=document.querySelector('[data-save-config]');if(config)config.onclick=async()=>{try{await api('POST',{action:'save_config',headline:document.getElementById('headline').value,opening_prompt:document.getElementById('opening_prompt').value,team_message:document.getElementById('team_message').value});set('Saved.');await load();show('admin')}catch(e){set(e.message)}};const store=document.querySelector('[data-save-store]');if(store)store.onclick=async()=>{const keys=['traffic','ppv','ppv_close','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','nextup_rate','csat','pre_to_post','pa4','opps','trade_rate','prepaid','open_enrollment'];try{await api('POST',{action:'save_store',fields:grab(keys)});set('Store saved.');await load();show('admin')}catch(e){set(e.message)}};document.querySelectorAll('[data-save-rep]').forEach(btn=>btn.onclick=async()=>{const slug=btn.dataset.saveRep,r=DATA.reps.find(x=>x.slug===slug),suffix='_'+r.metrics.rep_id,keys=['ppv','aia_posted','aia_submits','aia_close','htp','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','insurance_adds','insurance_eligible_opps','nextup_rate','csat','pa4','opps','trade_rate','prepaid','open_enrollment'];const fields={};for(const k of keys){const el=document.getElementById(k+suffix);if(el)fields[k]=el.value===''?null:Number(el.value)}try{await api('POST',{action:'save_rep',rep_slug:slug,fields});set(`${r.display_name} saved.`);await load();show('admin')}catch(e){set(e.message)}});const ac=document.querySelector('[data-add-coach]');if(ac)ac.onclick=async()=>{try{await api('POST',{action:'add_coaching',title:document.getElementById('coach_title').value,rep_slug:document.getElementById('coach_rep').value||null,kind:document.getElementById('coach_kind').value,body:document.getElementById('coach_body').value});set('Coaching added.');await load();show('admin')}catch(e){set(e.message)}};const as=document.querySelector('[data-add-sbs]');if(as)as.onclick=async()=>{try{await api('POST',{action:'add_sbs',rep_slug:document.getElementById('sbs_rep').value,observed_on:document.getElementById('sbs_date').value,title:document.getElementById('sbs_title').value,greet:numOrNull('sbs_greet'),understand:numOrNull('sbs_understand'),recommend:numOrNull('sbs_recommend'),confirm:numOrNull('sbs_confirm'),educate:numOrNull('sbs_educate'),thank:numOrNull('sbs_thank'),coaching_summary:document.getElementById('sbs_summary').value,notes:document.getElementById('sbs_notes').value});set('SBS added.');await load();show('admin')}catch(e){set(e.message)}}}
