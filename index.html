</style></head><body><header class="top"><div class="toprow"><div class="brand">Team Huddle</div><nav class="nav" id="nav"><button class="active" data-page="home">Coaching</button><button data-page="store">Store</button><button data-page="team">Rep Pages</button><button data-page="sbs">SBS</button><button data-page="archives">Awards / Archives</button><button data-page="admin">Edit</button></nav></div></header><main id="app"><div class="hero"><div class="eyebrow">Loading</div><h1>Team Huddle</h1><p>Connecting to September data…</p></div></main>
<script>
let DATA=null,adminPhrase=sessionStorage.getItem('huddleAdmin')||'';const app=document.getElementById('app'),nav=document.getElementById('nav');
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`;const num=n=>Number(n||0).toLocaleString();
async function api(method='GET',body){const r=await fetch('/api/huddle',{method,headers:{'content-type':'application/json',...(adminPhrase?{'x-admin-phrase':adminPhrase}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{DATA=await api();render();}catch(e){app.innerHTML=`<div class="hero"><div class="eyebrow">Connection Problem</div><h1>September Huddle</h1><p>${e.message||'Unable to load data'}</p></div><div class="card"><div class="body"><b>The site could not reach Neon.</b><div class="status">DATABASE_URL is already expected in Vercel. Refresh once after deployment; if this remains, send TJ the exact error shown above.</div></div></div>`}}
function goalClass(v,g){if(!g)return'';const x=Number(v)/Number(g);return x>=1?'good':x>=.75?'warn':'bad'}
function metric(label,value,goal,fmt='num',edit=null){const f=fmt==='money'?money:fmt==='pct'?pct:num;const ratio=goal?Math.min(100,Number(value)/Number(goal)*100):0;const ed=adminPhrase&&edit?` adminEditable`:'',attrs=adminPhrase&&edit?` data-inline-scope="${edit.scope}" data-inline-field="${edit.field}" data-inline-rep="${edit.rep||''}" data-inline-fmt="${fmt}"`:'';return `<div class="metric ${goalClass(value,goal)}${ed}"${attrs}><div class="label">${label}</div><div class="value">${f(value)}</div><div class="sub">${goal?`Goal ${f(goal)}`:'Current'}</div>${goal?`<div class="progress"><span style="width:${ratio}%"></span></div>`:''}</div>`}
function coachingCards(repSlug=null){const rows=DATA.coaching.filter(c=>repSlug?c.rep_slug===repSlug:!c.rep_slug);return rows.map(c=>`<div class="context"><h3>${c.title||c.kind}</h3><p>${c.body}</p></div>`).join('')||`<div class="context"><h3>Fresh board</h3><p>No coaching point added yet.</p></div>`}
function homePage(){const c=DATA.config;return `<section class="page active" id="home"><div class="hero"><div class="eyebrow">${c.month_label} · Fresh Start</div><h1>${c.headline}</h1><p>${c.opening_prompt}</p></div><div class="section">Coaching Board</div><div class="grid">${coachingCards()}</div><div class="section">Team Message</div><div class="context"><p>${c.team_message}</p></div></section>`}
function storePage(){const s=DATA.store,g=DATA.goals;return `<section class="page" id="store">${adminModeBar()}<div class="hero"><div class="eyebrow">Store Scoreboard</div><h1>September</h1><p>Live store numbers vs goal.${adminPhrase?' Manager Mode is on — tap any card with a pencil to edit.':''}</p></div><div class="metrics">${metric('PPV',s.ppv,g.ppv,'num',{scope:'store',field:'ppv'})}${metric('AIA Posted',s.aia_posted,g.aia_posted,'num',{scope:'store',field:'aia_posted'})}${metric('AIA Submits',s.aia_submits,g.aia_submits,'num',{scope:'store',field:'aia_submits'})}${metric('HTP',s.htp,g.htp,'num',{scope:'store',field:'htp'})}${metric('Upgrades',s.upgrades,g.upgrades,'num',{scope:'store',field:'upgrades'})}${metric('Data',s.data,g.data,'num',{scope:'store',field:'data'})}${metric('Accessories / OPP',s.acc_per_opp,g.accessory_target,'money',{scope:'store',field:'acc_per_opp'})}${metric('Insurance',s.insurance_rate,g.insurance_target,'pct',{scope:'store',field:'insurance_rate'})}${metric('Trade',s.trade_rate,g.trade_target,'pct',{scope:'store',field:'trade_rate'})}${metric('CSAT',s.csat,g.csat_target,'pct',{scope:'store',field:'csat'})}${metric('OPPs',s.opps,g.opportunities,'num',{scope:'store',field:'opps'})}${metric('Traffic',s.traffic,g.traffic,'num',{scope:'store',field:'traffic'})}</div></section>`}

function defaultRepGoals(r){const g=DATA.goals,n=Math.max(DATA.reps.length,1);return {ppv:Math.round(Number(g.ppv||0)/n),aia_posted:Math.round(Number(g.aia_posted||0)/n),aia_submits:Number(g.rep_aia_qualifier||0),aia_close:Number(g.aia_close||0),htp:Number(g.rep_htp_qualifier||0),upgrades:Math.round(Number(g.upgrades||0)/n),data:Math.round(Number(g.data||0)/n),accessory_target:Number(g.accessory_target||0),insurance_target:Number(g.insurance_target||0),trade_target:Number(g.trade_target||0),csat_target:Number(g.csat_target||0)}}
function repGoals(r){const d=defaultRepGoals(r),o=r.goal_overrides||{};Object.keys(d).forEach(k=>{if(o[k]!==null&&o[k]!==undefined)d[k]=Number(o[k])});return d}

function bindAdmin(){const stat=document.getElementById('adminStatus');const set=s=>{if(stat)stat.textContent=s};const sg=document.querySelector('[data-save-goals]');if(sg)sg.onclick=async()=>{const pctKeys=new Set(['ppv_close','aia_close','htp_close','insurance_target','insurance_qualifier','trade_target','csat_target']),keys=['traffic','opportunities','ppv','ppv_close','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','accessory_target','accessory_qualifier','insurance_target','insurance_qualifier','trade_target','csat_target','rep_aia_qualifier','rep_htp_qualifier'],fields={};for(const k of keys){const el=document.getElementById('goal_'+k);if(el){let v=Number(el.value||0);if(pctKeys.has(k))v/=100;fields[k]=v}}try{await api('POST',{action:'save_goals',fields});set('Goals saved.');await load();show('admin')}catch(e){set(e.message)}};const config=document.querySelector('[data-save-config]');if(config)config.onclick=async()=>{try{await api('POST',{action:'save_config',headline:document.getElementById('headline').value,opening_prompt:document.getElementById('opening_prompt').value,team_message:document.getElementById('team_message').value});set('Saved.');await load();show('admin')}catch(e){set(e.message)}};const store=document.querySelector('[data-save-store]');if(store)store.onclick=async()=>{const keys=['traffic','ppv','ppv_close','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','nextup_rate','csat','pre_to_post','pa4','opps','trade_rate','prepaid','open_enrollment'];try{await api('POST',{action:'save_store',fields:grab(keys)});set('Store saved.');await load();show('admin')}catch(e){set(e.message)}};document.querySelectorAll('[data-save-rep]').forEach(btn=>btn.onclick=async()=>{const slug=btn.dataset.saveRep,r=DATA.reps.find(x=>x.slug===slug),suffix='_'+r.metrics.rep_id,keys=['ppv','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','nextup_rate','csat','pa4','opps','trade_rate','prepaid','open_enrollment'];const fields={};for(const k of keys){const el=document.getElementById(k+suffix);if(el)fields[k]=el.value===''?null:Number(el.value)}try{await api('POST',{action:'save_rep',rep_slug:slug,fields});set(`${r.display_name} saved.`);await load();show('admin')}catch(e){set(e.message)}});const ac=document.querySelector('[data-add-coach]');if(ac)ac.onclick=async()=>{try{await api('POST',{action:'add_coaching',title:document.getElementById('coach_title').value,rep_slug:document.getElementById('coach_rep').value||null,kind:document.getElementById('coach_kind').value,body:document.getElementById('coach_body').value,status:document.getElementById('coach_status')?.value||'new'});set('Coaching added.');await load();show('admin')}catch(e){set(e.message)}};const as=document.querySelector('[data-add-sbs]');if(as)as.onclick=async()=>{try{await api('POST',{action:'add_sbs',rep_slug:document.getElementById('sbs_rep').value,observed_on:document.getElementById('sbs_date').value,title:document.getElementById('sbs_title').value,greet:numOrNull('sbs_greet'),understand:numOrNull('sbs_understand'),recommend:numOrNull('sbs_recommend'),confirm:numOrNull('sbs_confirm'),educate:numOrNull('sbs_educate'),thank:numOrNull('sbs_thank'),coaching_summary:document.getElementById('sbs_summary').value,notes:document.getElementById('sbs_notes').value,behavior_notes:{greet:document.getElementById('sbs_note_greet')?.value||'',understand:document.getElementById('sbs_note_understand')?.value||'',recommend:document.getElementById('sbs_note_recommend')?.value||'',confirm:document.getElementById('sbs_note_confirm')?.value||'',educate:document.getElementById('sbs_note_educate')?.value||'',thank:document.getElementById('sbs_note_thank')?.value||''}});set('SBS added.');await load();show('admin')}catch(e){set(e.message)}}}
function numOrNull(id){const v=document.getElementById(id).value;return v===''?null:Number(v)}
load();
</script></body></html>
