<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f49"><title>Team Huddle — September</title>
<style>
:root{--navy:#082f49;--blue:#0284c7;--sky:#e0f2fe;--ink:#172033;--muted:#64748b;--line:#dbe4ee;--page:#f4f7fb;--card:#fff;--green:#15803d;--greenbg:#dcfce7;--amber:#a16207;--amberbg:#fef3c7;--red:#b91c1c;--redbg:#fee2e2}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:50;background:linear-gradient(100deg,var(--navy),#075985);color:#fff;padding:10px;box-shadow:0 3px 18px #082f4930}.toprow{max-width:1180px;margin:auto;display:flex;align-items:center;gap:8px}.brand{font-weight:950}.nav{display:flex;gap:6px;overflow:auto;flex:1}.nav button{border:0;background:#ffffff16;color:#fff;padding:9px 11px;border-radius:10px;font-weight:850;white-space:nowrap}.nav button.active{background:#fff;color:var(--navy)}main{max-width:1180px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,var(--navy),#0369a1);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{margin:2px 0 6px;font-size:clamp(26px,6vw,40px)}.hero p{margin:0;color:#dbeafe}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:#7dd3fc}.section{font-size:18px;color:var(--navy);font-weight:1000;margin:18px 0 9px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.body{padding:13px}.grid{display:grid;gap:10px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:13px;padding:11px}.metric .label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:950}.metric .value{font-size:23px;font-weight:1000;color:var(--navy);margin:3px 0}.metric .sub{font-size:10px;color:var(--muted)}.good{border-top-color:var(--green)!important}.warn{border-top-color:var(--amber)!important}.bad{border-top-color:var(--red)!important}.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--blue)}.context{padding:12px;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;background:#fff}.context h3{margin:0 0 5px;color:var(--navy);font-size:14px}.context p{margin:0;line-height:1.45;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 13px;border-radius:999px;font-weight:900;white-space:nowrap}.tabs button.active{background:var(--navy);color:#fff}.repPane{display:none}.repPane.active{display:block}.repbanner{background:linear-gradient(135deg,#0c4a6e,#0284c7);color:#fff;border-radius:17px;padding:16px;margin-bottom:10px}.repbanner h2{margin:0}.repbanner p{margin:5px 0 0;color:#dbeafe}.calc{display:grid;gap:8px}.calcrow{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:6px;align-items:center}.calcrow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px}.result{padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.sbs{border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;overflow:hidden}.sbs summary{padding:11px;font-weight:900;color:var(--navy);cursor:pointer}.sbs .inside{border-top:1px solid var(--line);padding:11px;font-size:13px;line-height:1.5}.scores{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.chip{background:#eef2f6;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:850}.adminGate{max-width:420px;margin:30px auto}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:90px}.btn{border:0;background:var(--navy);color:#fff;padding:10px 13px;border-radius:10px;font-weight:900}.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:#991b1b}.adminSection{margin-bottom:12px}.adminGrid{display:grid;gap:10px}.status{font-size:12px;color:var(--muted);margin-top:8px}.small{font-size:11px;color:var(--muted)}@media(min-width:760px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:1fr 1fr}.adminGrid{grid-template-columns:1fr 1fr}.calcrow{grid-template-columns:1.6fr .7fr .7fr}.toprow{gap:12px}}
</style></head><body><header class="top"><div class="toprow"><div class="brand">Team Huddle</div><nav class="nav" id="nav"><button class="active" data-page="home">Coaching</button><button data-page="store">Store</button><button data-page="team">Rep Pages</button><button data-page="sbs">SBS</button><button data-page="archives">Awards / Archives</button><button data-page="admin">Edit</button></nav></div></header><main id="app"><div class="hero"><div class="eyebrow">Loading</div><h1>Team Huddle</h1><p>Connecting to September data…</p></div></main>
<script>
let DATA=null,adminPhrase=sessionStorage.getItem('huddleAdmin')||'';const app=document.getElementById('app'),nav=document.getElementById('nav');
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const pct=n=>`${(Number(n||0)*100).toFixed(1)}%`;const num=n=>Number(n||0).toLocaleString();
async function api(method='GET',body){const r=await fetch('/api/huddle',{method,headers:{'content-type':'application/json',...(adminPhrase?{'x-admin-phrase':adminPhrase}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{DATA=await api();if(DATA.needsSetup){renderSetup();return}render();}catch(e){const msg=String(e.message||'');if(msg.includes('app_config')||msg.includes('does not exist')){renderSetup();return}app.innerHTML=`<div class="hero"><div class="eyebrow">Connection Problem</div><h1>September Huddle</h1><p>${msg}</p></div><div class="card"><div class="body"><b>Neon is not ready yet.</b><div class="status">Check DATABASE_URL in Vercel, redeploy, then refresh.</div></div></div>`}}
function goalClass(v,g){if(!g)return'';const x=Number(v)/Number(g);return x>=1?'good':x>=.75?'warn':'bad'}
function metric(label,value,goal,fmt='num'){const f=fmt==='money'?money:fmt==='pct'?pct:num;const ratio=goal?Math.min(100,Number(value)/Number(goal)*100):0;return `<div class="metric ${goalClass(value,goal)}"><div class="label">${label}</div><div class="value">${f(value)}</div><div class="sub">${goal?`Goal ${f(goal)}`:'Current'}</div>${goal?`<div class="progress"><span style="width:${ratio}%"></span></div>`:''}</div>`}
function coachingCards(repSlug=null){const rows=DATA.coaching.filter(c=>repSlug?c.rep_slug===repSlug:!c.rep_slug);return rows.map(c=>`<div class="context"><h3>${c.title||c.kind}</h3><p>${c.body}</p></div>`).join('')||`<div class="context"><h3>Fresh board</h3><p>No coaching point added yet.</p></div>`}
function homePage(){const c=DATA.config;return `<section class="page active" id="home"><div class="hero"><div class="eyebrow">${c.month_label} · Fresh Start</div><h1>${c.headline}</h1><p>${c.opening_prompt}</p></div><div class="section">Coaching Board</div><div class="grid">${coachingCards()}</div><div class="section">Team Message</div><div class="context"><p>${c.team_message}</p></div></section>`}
function storePage(){const s=DATA.store,g=DATA.goals;return `<section class="page" id="store"><div class="hero"><div class="eyebrow">Store Scoreboard</div><h1>September</h1><p>Live store numbers vs goal.</p></div><div class="metrics">${metric('PPV',s.ppv,g.ppv)}${metric('AIA Posted',s.aia_posted,g.aia_posted)}${metric('AIA Submits',s.aia_submits,g.aia_submits)}${metric('HTP',s.htp,g.htp)}${metric('Upgrades',s.upgrades,g.upgrades)}${metric('Data',s.data,g.data)}${metric('Accessories / OPP',s.acc_per_opp,g.accessory_target,'money')}${metric('Insurance',s.insurance_rate,g.insurance_target,'pct')}${metric('Trade',s.trade_rate,g.trade_target,'pct')}${metric('CSAT',s.csat,g.csat_target,'pct')}${metric('OPPs',s.opps,g.opportunities)}${metric('Traffic',s.traffic,g.traffic)}</div></section>`}
function repMetrics(r){const m=r.metrics||{},g=DATA.goals;return `${metric('PPV',m.ppv,Math.round(g.ppv/Math.max(DATA.reps.length,1)))}${metric('AIA Submits',m.aia_submits,g.rep_aia_qualifier)}${metric('HTP',m.htp,g.rep_htp_qualifier)}${metric('Upgrades',m.upgrades,null)}${metric('Accessories / OPP',m.acc_per_opp,g.accessory_target,'money')}${metric('Insurance',m.insurance_rate,g.insurance_target,'pct')}${metric('Trade',m.trade_rate,g.trade_target,'pct')}${metric('CSAT',m.csat,g.csat_target,'pct')}`}
function needInsured(adds,elig,target){if(!elig)return null;if(adds/elig>=target)return 0;return Math.max(0,Math.ceil((target*elig-adds)/(1-target)-1e-9))}
function needOE(adds,elig,target){if(!elig)return null;return Math.max(0,Math.ceil(target*elig-adds-1e-9))}
function calcHtml(r){const m=r.metrics||{},den=Math.max(0,Number(m.opps||0)-Number(m.data||0));return `<div class="card"><div class="body"><b>Finish-the-Month Calculator</b> <span class="chip">Sandbox — does not save</span><div class="small">Starts with the live rep numbers. Reps can change anything below without affecting Neon.</div><div class="calc" data-calc="${r.slug}" data-base='${JSON.stringify(m).replaceAll("'","&#39;")}'><div class="calcrow"><b>Accessory $ / OPP</b><input type="number" step=".01" data-c="accavg" value="${Number(m.acc_per_opp||0)}"><div class="result" data-r="acc50">—</div></div><div class="calcrow"><b>Eligible OPPs</b><input type="number" data-c="accden" value="${den}"><div class="result" data-r="acc60">—</div></div><div class="calcrow"><b>Insurance %</b><input type="number" step=".01" data-c="insrate" value="${(Number(m.insurance_rate||0)*100).toFixed(2)}"><div class="result" data-r="ins50">—</div></div><div class="calcrow"><b>Total OPPs</b><input type="number" data-c="insopps" value="${Number(m.opps||0)}"><div class="result" data-r="ins60">—</div></div><div class="calcrow"><b>Known Insurance Adds</b><input type="number" data-c="insadds" value="${m.insurance_adds??''}" placeholder="optional"><div class="result" data-r="insnote">—</div></div><div class="calcrow"><b>Known Eligible Insurance OPPs</b><input type="number" data-c="inselig" value="${m.insurance_eligible_opps??''}" placeholder="optional"><div class="result">Exact if known</div></div><div class="section" style="margin:8px 0 4px;font-size:14px">Pay Projection</div><div class="small">I left PPV/AIA payout rates editable until we lock the exact comp formula. Upgrade/Data defaults use the rates we already have.</div><div class="calcrow"><b>PPV payout each</b><input type="number" step=".01" data-c="payppv" value="0"><div class="result" data-r="pay">$0.00</div></div><div class="calcrow"><b>AIA payout each</b><input type="number" step=".01" data-c="payaia" value="0"><div class="result">Editable</div></div><div class="calcrow"><b>Upgrade payout each</b><input type="number" step=".01" data-c="payupg" value="0.10"><div class="result">Current assumption</div></div><div class="calcrow"><b>Data payout each</b><input type="number" step=".01" data-c="paydata" value="0.20"><div class="result">Current assumption</div></div><div class="calcrow"><b>Add PPV / AIA / Upg / Data</b><input type="text" data-c="adds" value="0,0,0,0"><div class="result" data-r="paydetail">0 added</div></div></div></div></div>`}
function repsPage(){return `<section class="page" id="team"><div class="hero"><div class="eyebrow">Rep Pages</div><h1>Individual Pages</h1><p>Numbers, coaching, SBS and the sandbox calculator are open to the team.</p></div><div class="tabs">${DATA.reps.map((r,i)=>`<button class="${i?'':'active'}" data-rep="${r.slug}">${r.display_name}</button>`).join('')}</div>${DATA.reps.map((r,i)=>`<article class="repPane ${i?'':'active'}" id="rep-${r.slug}"><div class="repbanner"><h2>${r.display_name}</h2><p>September live scorecard</p></div><div class="metrics">${repMetrics(r)}</div><div class="section">Coaching</div><div class="grid">${coachingCards(r.slug)}</div><div class="section">Calculator</div>${calcHtml(r)}<div class="section">Recent SBS</div>${sbsFor(r.slug)}</article>`).join('')}</section>`}
function sbsFor(slug){const rows=DATA.sbs.filter(s=>s.rep_slug===slug);return rows.map(s=>`<details class="sbs"><summary>${s.observed_on?.slice(0,10)||''} · ${s.title||'Side-by-Side'}</summary><div class="inside"><div class="scores">${[['Greet',s.greet],['Understand',s.understand],['Recommend',s.recommend],['Confirm',s.confirm],['Educate',s.educate],['Thank',s.thank]].filter(x=>x[1]!=null).map(x=>`<span class="chip">${x[0]} ${x[1]}</span>`).join('')}</div>${s.coaching_summary?`<b>Coaching:</b> ${s.coaching_summary}<br><br>`:''}${s.notes||''}</div></details>`).join('')||'<div class="context"><p>No SBS entered yet.</p></div>'}
function sbsPage(){return `<section class="page" id="sbs"><div class="hero"><div class="eyebrow">Open SBS</div><h1>Side-by-Sides</h1><p>Visible to the team. Keep adding them and the history grows.</p></div>${DATA.reps.map(r=>`<div class="section">${r.display_name}</div>${sbsFor(r.slug)}`).join('')}</section>`}
function adminPage(){if(!adminPhrase)return `<section class="page" id="admin"><div class="adminGate card"><div class="body"><h2 style="margin-top:0">Admin Edit</h2><p class="small">Rep numbers and SBS are public. Editing is the only thing hidden.</p><div class="field"><label>Phrase</label><input id="adminPhrase" type="password" placeholder="Hello?"></div><button class="btn" id="unlockAdmin">Unlock</button></div></div></section>`;return `<section class="page" id="admin"><div class="hero"><div class="eyebrow">Admin Edit</div><h1>Update the Huddle</h1><p>Change numbers or coaching here. No new index needed.</p></div><div class="adminGrid"><div class="card adminSection"><div class="body"><h3>Front Page</h3>${field('Headline','headline',DATA.config.headline)}${field('Opening Prompt','opening_prompt',DATA.config.opening_prompt,'textarea')}${field('Team Message','team_message',DATA.config.team_message,'textarea')}<button class="btn" data-save-config>Save Front Page</button></div></div><div class="card adminSection"><div class="body"><h3>Store Numbers</h3>${metricInputs(DATA.store)}<button class="btn" data-save-store>Save Store Numbers</button></div></div></div><div class="section">Rep Numbers</div><div class="adminGrid">${DATA.reps.map(r=>`<div class="card"><div class="body"><h3>${r.display_name}</h3>${metricInputs(r.metrics,true)}<button class="btn" data-save-rep="${r.slug}">Save ${r.display_name}</button></div></div>`).join('')}</div><div class="section">Add Coaching Point</div><div class="card"><div class="body"><div class="adminGrid">${field('Title','coach_title','')}${selectField('Who','coach_rep',[['','Store'],...DATA.reps.map(r=>[r.slug,r.display_name])])}${selectField('Type','coach_kind',[['coach','Coach'],['shoutout','Shoutout'],['focus','Focus'],['finish','Finish']])}</div>${field('Body','coach_body','','textarea')}<button class="btn" data-add-coach>Add Coaching</button></div></div><div class="section">Add SBS</div><div class="card"><div class="body"><div class="adminGrid">${selectField('Rep','sbs_rep',DATA.reps.map(r=>[r.slug,r.display_name]))}${field('Date','sbs_date',new Date().toISOString().slice(0,10),'date')}${field('Title','sbs_title','Side-by-Side')}</div><div class="adminGrid">${['greet','understand','recommend','confirm','educate','thank'].map(x=>field(x[0].toUpperCase()+x.slice(1),`sbs_${x}`,'','number')).join('')}</div>${field('Coaching Summary','sbs_summary','','textarea')}${field('Notes','sbs_notes','','textarea')}<button class="btn" data-add-sbs>Add SBS</button></div></div><div class="status" id="adminStatus"></div></section>`}
function field(label,id,val,type='text'){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea id="${id}">${val??''}</textarea>`:`<input id="${id}" type="${type}" value="${val??''}">`}</div>`}function selectField(label,id,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`}
function metricInputs(m={},rep=false){const arr=[['PPV','ppv'],['AIA Posted','aia_posted'],['AIA Submits','aia_submits'],['AIA Close','aia_close'],['HTP','htp'],['Upgrades','upgrades'],['Data','data'],['CRU','cru'],['Accessory Revenue','accessory_revenue'],['ACC/OPP','acc_per_opp'],['Insurance Rate','insurance_rate'],['Insurance Adds','insurance_adds'],['Insurance Eligible OPPs','insurance_eligible_opps'],['Next Up','nextup_rate'],['CSAT','csat'],['PA4','pa4'],['OPPs','opps'],['Trade','trade_rate'],['Prepaid','prepaid'],['Open Enrollment','open_enrollment']];if(!rep)arr.unshift(['Traffic','traffic'],['PPV Close','ppv_close'],['HTP Close','htp_close']);return `<div class="adminGrid">${arr.map(([l,k])=>field(l,k+(rep?'_'+(m.rep_id||'rep'):''),m[k]??0,'number')).join('')}</div>`}
function archivesPage(){return `<section class="page" id="archives"><div class="hero"><div class="eyebrow">Coming Next</div><h1>Awards & Archives</h1><p>Monthly wins and history without cluttering the daily huddle.</p></div><div class="grid two"><div class="context"><h3>September Awards</h3><p>Top PPV · Top AIA · Accessory Leader · Protection Leader · Biggest Improvement · Huddle MVP</p></div><div class="context"><h3>Monthly Archives</h3><p>Store scorecard + rep snapshots + SBS history. We can start saving month-end snapshots here.</p></div></div></section>`}
function render(){app.innerHTML=homePage()+storePage()+repsPage()+sbsPage()+archivesPage()+adminPage();bind();show('home')}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}
function bind(){nav.onclick=e=>{const b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-rep]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.repPane').forEach(p=>p.classList.toggle('active',p.id==='rep-'+b.dataset.rep))});document.querySelectorAll('[data-calc]').forEach(calc=>{const base=JSON.parse(calc.dataset.base||'{}');const q=s=>calc.querySelector(s),v=k=>Number(q(`[data-c="${k}"]`)?.value||0);const upd=()=>{const avg=v('accavg'),den=Math.max(0,v('accden')),rev=avg*den;const n50=Math.max(0,50*(den+1)-rev),n60=Math.max(0,60*(den+1)-rev);q('[data-r="acc50"]').textContent=`Next OPP: $${n50.toFixed(2)} → $50`;q('[data-r="acc60"]').textContent=`Next OPP: $${n60.toFixed(2)} → $60`;const rate=v('insrate')/100,opps=Math.max(0,Math.round(v('insopps'))),addsEl=q('[data-c="insadds"]'),eligEl=q('[data-c="inselig"]');if(addsEl.value!==''&&eligEl.value!==''){const a=+addsEl.value,e=+eligEl.value;q('[data-r="ins50"]').textContent=`50%: ${needInsured(a,e,.5)} insured or ${needOE(a,e,.5)} OE`;q('[data-r="ins60"]').textContent=`60%: ${needInsured(a,e,.6)} insured or ${needOE(a,e,.6)} OE`;q('[data-r="insnote"]').textContent=`${a}/${e} exact`}else{const cand=[];for(let e=1;e<=opps;e++)for(let a=0;a<=e;a++)if(Math.abs(a/e-rate)<=.0055)cand.push([a,e]);if(cand.length){const range=(arr)=>{const lo=Math.min(...arr),hi=Math.max(...arr);return lo===hi?`${lo}`:`${lo}-${hi}`};q('[data-r="ins50"]').textContent=`50%: ${range(cand.map(x=>needInsured(x[0],x[1],.5)))} insured`;q('[data-r="ins60"]').textContent=`60%: ${range(cand.map(x=>needInsured(x[0],x[1],.6)))} insured`;q('[data-r="insnote"]').textContent=`Best effort · ${cand.length} possible fractions`}else{q('[data-r="ins50"]').textContent='Need counts';q('[data-r="ins60"]').textContent='Need counts';q('[data-r="insnote"]').textContent='Add exact counts if known'}}const parts=(q('[data-c="adds"]').value||'0,0,0,0').split(',').map(x=>Number(x.trim())||0);const ppv=Number(base.ppv||0)+parts[0],aia=Number(base.aia_posted||0)+parts[1],upg=Number(base.upgrades||0)+parts[2],data=Number(base.data||0)+parts[3],pay=ppv*v('payppv')+aia*v('payaia')+upg*v('payupg')+data*v('paydata');q('[data-r="pay"]').textContent=`$${pay.toFixed(2)}`;q('[data-r="paydetail"]').textContent=`${ppv} PPV · ${aia} AIA · ${upg} Upg · ${data} Data`};calc.querySelectorAll('input').forEach(i=>i.oninput=upd);upd()});const u=document.getElementById('unlockAdmin');if(u)u.onclick=()=>{adminPhrase=document.getElementById('adminPhrase').value;sessionStorage.setItem('huddleAdmin',adminPhrase);render();show('admin')};bindAdmin()}
function collectStore(prefix=''){const out={};document.querySelectorAll(`#admin input[id${prefix?'$="_'+prefix+'"':''}]`);return out}
function grab(ids){const o={};for(const id of ids){const el=document.getElementById(id);if(el)o[id]=el.value===''?null:Number.isNaN(Number(el.value))?el.value:Number(el.value)}return o}
function bindAdmin(){const stat=document.getElementById('adminStatus');const set=s=>{if(stat)stat.textContent=s};const config=document.querySelector('[data-save-config]');if(config)config.onclick=async()=>{try{await api('POST',{action:'save_config',headline:document.getElementById('headline').value,opening_prompt:document.getElementById('opening_prompt').value,team_message:document.getElementById('team_message').value});set('Saved.');await load();show('admin')}catch(e){set(e.message)}};const store=document.querySelector('[data-save-store]');if(store)store.onclick=async()=>{const keys=['traffic','ppv','ppv_close','aia_posted','aia_submits','aia_close','htp','htp_close','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','nextup_rate','csat','pre_to_post','pa4','opps','trade_rate','prepaid','open_enrollment'];try{await api('POST',{action:'save_store',fields:grab(keys)});set('Store saved.');await load();show('admin')}catch(e){set(e.message)}};document.querySelectorAll('[data-save-rep]').forEach(btn=>btn.onclick=async()=>{const slug=btn.dataset.saveRep,r=DATA.reps.find(x=>x.slug===slug),suffix='_'+r.metrics.rep_id,keys=['ppv','aia_posted','aia_submits','aia_close','htp','upgrades','data','cru','accessory_revenue','acc_per_opp','insurance_rate','insurance_adds','insurance_eligible_opps','nextup_rate','csat','pa4','opps','trade_rate','prepaid','open_enrollment'];const fields={};for(const k of keys){const el=document.getElementById(k+suffix);if(el)fields[k]=el.value===''?null:Number(el.value)}try{await api('POST',{action:'save_rep',rep_slug:slug,fields});set(`${r.display_name} saved.`);await load();show('admin')}catch(e){set(e.message)}});const ac=document.querySelector('[data-add-coach]');if(ac)ac.onclick=async()=>{try{await api('POST',{action:'add_coaching',title:document.getElementById('coach_title').value,rep_slug:document.getElementById('coach_rep').value||null,kind:document.getElementById('coach_kind').value,body:document.getElementById('coach_body').value});set('Coaching added.');await load();show('admin')}catch(e){set(e.message)}};const as=document.querySelector('[data-add-sbs]');if(as)as.onclick=async()=>{try{await api('POST',{action:'add_sbs',rep_slug:document.getElementById('sbs_rep').value,observed_on:document.getElementById('sbs_date').value,title:document.getElementById('sbs_title').value,greet:numOrNull('sbs_greet'),understand:numOrNull('sbs_understand'),recommend:numOrNull('sbs_recommend'),confirm:numOrNull('sbs_confirm'),educate:numOrNull('sbs_educate'),thank:numOrNull('sbs_thank'),coaching_summary:document.getElementById('sbs_summary').value,notes:document.getElementById('sbs_notes').value});set('SBS added.');await load();show('admin')}catch(e){set(e.message)}}}
function numOrNull(id){const v=document.getElementById(id).value;return v===''?null:Number(v)}
function renderSetup(){app.innerHTML=`<section class="page active"><div class="hero"><div class="eyebrow">Database Ready to Initialize</div><h1>September Setup</h1><p>Neon is connected. One click creates the September database, zeroes every actual, and loads editable placeholder goals.</p></div><div class="adminGate card"><div class="body"><div class="field"><label>Admin Phrase</label><input id="setupPhrase" type="password" placeholder="Hello?"></div><button class="btn" id="runSetup">Initialize September</button><div class="status" id="setupStatus"></div></div></div></section>`;document.getElementById('runSetup').onclick=async()=>{const phrase=document.getElementById('setupPhrase').value,st=document.getElementById('setupStatus');try{const r=await fetch('/api/setup',{method:'POST',headers:{'content-type':'application/json','x-admin-phrase':phrase}});const j=await r.json();if(!r.ok)throw new Error(j.error);adminPhrase=phrase;sessionStorage.setItem('huddleAdmin',phrase);await load()}catch(e){st.textContent=e.message}}}
load();
</script></body></html>
